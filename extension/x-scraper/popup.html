<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; font-family: sans-serif; background: #15202b; color: #fff; margin: 0; padding: 14px; }
    h3 { margin: 0 0 10px; font-size: 15px; border-bottom: 1px solid #38444d; padding-bottom: 6px; }
    p { font-size: 13px; margin: 6px 0; }
    b { color: #1d9bf0; }
    input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 7px 8px; border-radius: 8px; border: 1px solid #38444d; background: #0f151b; color: #fff; font-size: 12px; }
    button { width: 100%; margin-top: 7px; padding: 9px; border: none; border-radius: 99px; cursor: pointer; font-weight: bold; color: #fff; font-size: 13px; }
    #downloadBtn { background: #8e44ad; }
    #sendBtn { background: #e0932f; }
    #resetBtn { background: #f4212e; }
    #msg { font-size: 11.5px; color: #8899a6; min-height: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>🤖 Camerad X-Scraper</h3>
  <p>Data tersimpan: <b id="count">0</b></p>
  <input id="server" placeholder="http://localhost:8080">
  <button id="downloadBtn">⬇ Download NDJSON</button>
  <button id="sendBtn">🚀 Kirim ke Server</button>
  <button id="resetBtn">🗑 Reset Data</button>
  <p id="msg"></p>
  <script src="popup.js"></script>
</body>
</html>
