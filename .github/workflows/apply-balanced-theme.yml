name: Apply balanced landing theme

on:
  push:
    branches:
      - refine/landing-balanced-theme

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update browser theme fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('templates/landing/landing.html')
          text = path.read_text(encoding='utf-8')
          old = '<meta name="theme-color" content="#0b1020">'
          new = '<meta name="theme-color" content="#080b12">'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one theme-color match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify balanced theme
        run: |
          python scripts/oneoff/check_structure.py
          python -m unittest tests.test_landing
      - name: Commit final theme
        run: |
          rm .github/workflows/apply-balanced-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/landing/landing.html static/landing/landing-theme.css static/landing/landing-theme.js tests/test_landing.py .github/workflows/apply-balanced-theme.yml
          git commit -m "refactor: finalize balanced landing palette"
          git push origin "HEAD:${GITHUB_REF_NAME}"
