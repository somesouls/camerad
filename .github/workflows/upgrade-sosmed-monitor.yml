name: Upgrade Sosmed Monitor
on:
  push:
    branches: [feature/sosmed-monitor-post-export]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix monitor initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sosmed/monitor.py')
          s=p.read_text(encoding='utf-8')
          anchor='def monitor_posts(conn, platform="", range_="all", start="", end="", q="",\n                  limit=300):'
          pos=s.index(anchor)
          tail=s[pos:]
          old='    ensure_review_columns(conn)\n    off = _off_set()\n    labels = _all_post_labels(conn)\n'
          if old not in tail:
              raise SystemExit('blok monitor_posts tidak ditemukan')
          tail=tail.replace(old,'    ensure_review_columns(conn)\n    ensure_auto_post_labels(conn)\n    off = _off_set()\n    labels = _all_post_labels(conn)\n',1)
          p.write_text(s[:pos]+tail,encoding='utf-8')
          PY
      - name: Validate focused upgrade
        run: |
          python -m py_compile sosmed/monitor.py sosmed/routes.py sosmed/ig_collector.py sosmed/tiktok_collector.py
          python -m unittest tests.test_sosmed_monitor
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sosmed/monitor.py
          git diff --cached --quiet || git commit -m "Aktifkan label otomatis pada daftar postingan [skip ci]"
          git push
