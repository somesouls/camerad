name: Upgrade Sosmed Monitor
on:
  push:
    branches: [feature/sosmed-monitor-post-export]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate focused upgrade
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python tools/upgrade_sosmed_monitor.py
            python -m py_compile sosmed/monitor.py sosmed/routes.py sosmed/ig_collector.py sosmed/tiktok_collector.py
            python -m unittest tests.test_sosmed_monitor
            git diff --check
          } > upgrade-sosmed-diagnostic.txt 2>&1
      - name: Commit diagnostic on failure
        if: steps.validate.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f upgrade-sosmed-diagnostic.txt
          git add sosmed/monitor.py sosmed/routes.py sosmed/ig_collector.py sosmed/tiktok_collector.py templates/sosmed_monitor.html tests/test_sosmed_monitor.py || true
          git commit -m "Catat hasil validasi upgrade sosmed [skip ci]"
          git push
          exit 1
      - name: Commit generated files
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sosmed/monitor.py sosmed/routes.py sosmed/ig_collector.py sosmed/tiktok_collector.py templates/sosmed_monitor.html tests/test_sosmed_monitor.py
          git diff --cached --quiet || git commit -m "Tambah ekspor dan label otomatis per postingan [skip ci]"
          git push
