name: Apply landing live contrast

on:
  push:
    branches:
      - fix/landing-live-css-contrast

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable cache and strengthen contrast
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('static/landing/landing.css')
          html_path = Path('templates/landing/landing.html')
          route_path = Path('routes/landing_routes.py')
          test_path = Path('tests/test_landing.py')

          css = css_path.read_text(encoding='utf-8')
          css = css.replace(
              '/* LANDING TOKENS: CANONICAL EARTH THEME */',
              '/* LIVE THEME: edit :root for dark mode and :root[data-theme="light"] for light mode. */\n/* Landing assets are served with Cache-Control: no-store for immediate manual testing. */',
              1,
          )
          replacements = {
              '--lp-bg-soft: #2d2c22': '--lp-bg-soft: #2b2b22',
              '--lp-surface: rgba(45,44,34,.82)': '--lp-surface: #36352a',
              '--lp-surface-strong: #39372b': '--lp-surface-strong: #464438',
              '--lp-body-text: #d6cabc': '--lp-body-text: #eee4d8',
              '--lp-line: rgba(247,238,228,.14)': '--lp-line: rgba(255,248,238,.28)',
              '--lp-primary: #8d4b2d': '--lp-primary: #f07840',
              '--lp-secondary: #b7c99a': '--lp-secondary: #c9e3d4',
              '--lp-accent-text: #d89a77': '--lp-accent-text: #ffad84',
              '--lp-on-accent: #fffaf5': '--lp-on-accent: #21140e',
              '--lp-soft-fill: rgba(141,75,45,.14)': '--lp-soft-fill: rgba(240,120,64,.22)',
              '--lp-glow-primary: rgba(141,75,45,.32)': '--lp-glow-primary: rgba(240,120,64,.46)',
              '--lp-gradient: linear-gradient(110deg,#8d4b2d,#c8754e 55%,#d8a15f)': '--lp-gradient: linear-gradient(110deg,#f07840,#ff9863 55%,#f8c47b)',
              '--lp-surface: rgba(255,247,237,.84)': '--lp-surface: #fffaf5',
              '--lp-surface-strong: #fff7ed': '--lp-surface-strong: #ffffff',
              '--lp-body-text: #4c372a': '--lp-body-text: #3e291e',
              '--lp-line: rgba(78,46,29,.14)': '--lp-line: rgba(73,35,15,.26)',
              '--lp-primary: #d84a05': '--lp-primary: #b43a00',
              '--lp-secondary: #2f6f64': '--lp-secondary: #22665b',
              '--lp-accent-text: #9f3604': '--lp-accent-text: #8e2d00',
              '--lp-soft-fill: rgba(216,74,5,.09)': '--lp-soft-fill: rgba(180,58,0,.15)',
              '--lp-glow-primary: rgba(216,74,5,.2)': '--lp-glow-primary: rgba(180,58,0,.3)',
              '--lp-gradient: linear-gradient(110deg,#d84a05,#ed6d2f 55%,#a63300)': '--lp-gradient: linear-gradient(110deg,#b43a00,#d84a05 55%,#8f2c00)',
              '.lp-button-primary{background: var(--lp-gradient);color: #271a12;border: 0;box-shadow: 0 14px 38px var(--lp-glow-primary)}': '.lp-button-primary{background: var(--lp-gradient);color: var(--lp-on-accent);border: 1px solid color-mix(in srgb,var(--lp-primary) 72%,white);box-shadow: 0 16px 44px var(--lp-glow-primary)}',
              '.lp-button-ghost, .lp-button-sm{background: color-mix(in srgb, var(--lp-surface-strong) 52%, transparent);color: var(--lp-heading-text)}': '.lp-button-ghost, .lp-button-sm{background: var(--lp-surface-strong);color: var(--lp-heading-text);border-color: var(--lp-line)}',
              '.lp-problem,.lp-solution,.lp-cap,.lp-govern-grid article{position: relative;overflow: hidden;border: 1px solid var(--lp-line);border-radius: var(--lp-radius);background: var(--lp-surface);transition: .25s}': '.lp-problem,.lp-solution,.lp-cap,.lp-govern-grid article{position: relative;overflow: hidden;border: 1px solid var(--lp-line);border-radius: var(--lp-radius);background: var(--lp-surface);box-shadow: 0 16px 44px color-mix(in srgb,var(--lp-bg) 46%,transparent);transition: .25s}',
              '.lp-problem:hover,.lp-cap:hover,.lp-govern-grid article:hover{transform: translateY(-5px);border-color: color-mix(in srgb,var(--lp-primary) 45%,transparent)}': '.lp-problem:hover,.lp-cap:hover,.lp-govern-grid article:hover{transform: translateY(-6px);border-color: var(--lp-primary);box-shadow: 0 20px 55px var(--lp-glow-primary)}',
              '.lp-kpis article{padding: 14px 12px;border: 1px solid var(--lp-line);border-radius: 13px;background: rgba(255,255,255,.025)}': '.lp-kpis article{padding: 14px 12px;border: 1px solid var(--lp-line);border-radius: 13px;background: var(--lp-surface-strong);box-shadow: inset 0 3px 0 color-mix(in srgb,var(--lp-primary) 72%,transparent)}',
              '.lp-window{position: relative;overflow: hidden;border: 1px solid rgba(255,255,255,.15);': '.lp-window{position: relative;overflow: hidden;border: 1px solid var(--lp-line);',
          }
          for old, new in replacements.items():
              count = css.count(old)
              if count == 0:
                  raise SystemExit(f'Missing CSS target: {old[:70]}')
              css = css.replace(old, new)

          card_rule = '.lp-problem:before,.lp-cap:before,.lp-govern-grid article:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--lp-gradient);opacity:.95}\n'
          target = '.lp-problem{padding: 26px}'
          if css.count(target) != 1:
              raise SystemExit('Unexpected problem-card rule')
          css = css.replace(target, card_rule + target, 1)
          css = css.replace(' !important', '')
          css_path.write_text(css, encoding='utf-8')

          html = html_path.read_text(encoding='utf-8')
          old_url = '/static/landing/landing.css?v=earth-clean-20260922'
          new_url = '/static/landing/landing.css?v=contrast-live-20260922-1'
          if html.count(old_url) != 1:
              raise SystemExit('Unexpected CSS asset version')
          html_path.write_text(html.replace(old_url, new_url, 1), encoding='utf-8')

          route = route_path.read_text(encoding='utf-8')
          needle = 'def register(app):\n    @app.get("/", response_class=HTMLResponse)'
          middleware = '''def register(app):
    @app.middleware("http")
    async def disable_landing_asset_cache(request: Request, call_next):
        response = await call_next(request)
        if request.url.path.startswith("/static/landing/"):
            response.headers["Cache-Control"] = "no-store, no-cache, must-revalidate, max-age=0"
            response.headers["Pragma"] = "no-cache"
            response.headers["Expires"] = "0"
        return response

    @app.get("/", response_class=HTMLResponse)'''
          if route.count(needle) != 1:
              raise SystemExit('Unexpected landing register function')
          route = route.replace(needle, middleware, 1)
          route = route.replace('return HTMLResponse(_load_html("landing/landing.html"))', 'return HTMLResponse(_load_html("landing/landing.html"), headers={"Cache-Control": "no-store"})', 1)
          route_path.write_text(route, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(old_url, new_url)
          tests += '''\n\nclass LandingLiveCssContractTest(unittest.TestCase):\n    def test_landing_assets_are_uncached_and_visibly_contrasted(self):\n        css = (ROOT / "static/landing/landing.css").read_text(encoding="utf-8")\n        route = (ROOT / "routes/landing_routes.py").read_text(encoding="utf-8")\n        self.assertIn("Cache-Control", route)\n        self.assertIn("no-store, no-cache, must-revalidate, max-age=0", route)\n        self.assertIn("#f07840", css)\n        self.assertIn("#b43a00", css)\n        self.assertIn("height:4px;background:var(--lp-gradient)", css)\n        self.assertNotIn(" !important", css)\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Verify live CSS behavior
        run: |
          python scripts/oneoff/check_structure.py
          python -m unittest tests.test_landing
      - name: Commit contrast changes
        run: |
          rm .github/workflows/apply-landing-live-contrast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/landing/landing.css templates/landing/landing.html routes/landing_routes.py tests/test_landing.py .github/workflows/apply-landing-live-contrast.yml
          git commit -m "fix: serve live landing CSS with stronger contrast"
          git push origin "HEAD:${GITHUB_REF_NAME}"
