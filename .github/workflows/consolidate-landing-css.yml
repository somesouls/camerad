name: Consolidate landing CSS

on:
  push:
    branches:
      - fix/landing-css-source-of-truth

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make landing.css the only style source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base_path = Path('static/landing/landing.css')
          theme_path = Path('static/landing/landing-theme.css')
          html_path = Path('templates/landing/landing.html')
          test_path = Path('tests/test_landing.py')

          base = base_path.read_text(encoding='utf-8').rstrip()
          theme = theme_path.read_text(encoding='utf-8').strip()
          marker = '/* === LANDING THEME: EARTH TONE — SOURCE OF TRUTH === */'
          if marker in base:
              raise SystemExit('Theme marker already exists in landing.css')
          base_path.write_text(base + '\n\n' + marker + '\n' + theme + '\n', encoding='utf-8')

          html = html_path.read_text(encoding='utf-8')
          old_css = '<link rel="stylesheet" href="/static/landing/landing.css">'
          new_css = '<link rel="stylesheet" href="/static/landing/landing.css?v=earth-20260922">'
          old_theme = '  <link rel="stylesheet" href="/static/landing/landing-theme.css">\n'
          if html.count(old_css) != 1 or html.count(old_theme) != 1:
              raise SystemExit('Unexpected landing stylesheet links')
          html = html.replace(old_css, new_css, 1).replace(old_theme, '', 1)
          html_path.write_text(html, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace("        self.assertIn('/static/landing/landing-theme.css', html)\n", '')
          tests = tests.replace('            ROOT / "static/landing/landing-theme.css",\n', '')
          tests = tests.replace('css = (ROOT / "static/landing/landing-theme.css").read_text(encoding="utf-8")', 'css = (ROOT / "static/landing/landing.css").read_text(encoding="utf-8")')
          tests = tests.replace("        self.assertIn('/static/landing/landing.css', html)\n", "        self.assertIn('/static/landing/landing.css?v=earth-20260922', html)\n")
          tests += '\n\nclass LandingStylesheetSourceTest(unittest.TestCase):\n    def test_landing_has_one_stylesheet_source(self):\n        html = (ROOT / "templates/landing/landing.html").read_text(encoding="utf-8")\n        css = (ROOT / "static/landing/landing.css").read_text(encoding="utf-8")\n        self.assertNotIn("landing-theme.css", html)\n        self.assertIn("LANDING THEME: EARTH TONE", css)\n        self.assertIn("#ffe8d1", css)\n        self.assertIn("#d84a05", css)\n        self.assertIn("#23231a", css)\n        self.assertIn("#8d4b2d", css)\n'
          test_path.write_text(tests, encoding='utf-8')

          theme_path.unlink()
          PY
      - name: Verify consolidated stylesheet
        run: |
          python scripts/oneoff/check_structure.py
          python -m unittest tests.test_landing
      - name: Commit consolidation
        run: |
          rm .github/workflows/consolidate-landing-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/landing/landing.html static/landing/landing.css static/landing/landing-theme.css tests/test_landing.py .github/workflows/consolidate-landing-css.yml
          git commit -m "fix: make landing.css the theme source of truth"
          git push origin "HEAD:${GITHUB_REF_NAME}"
