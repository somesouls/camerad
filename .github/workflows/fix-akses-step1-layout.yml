name: Fix access Step 1 table layout

on:
  push:
    branches:
      - fix/akses-step1-table-layout

permissions:
  contents: write

jobs:
  layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Step 1 table full width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('templates/akses.html')
          s = p.read_text(encoding='utf-8')
          old = '.role-layout { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr); gap:18px; align-items:start; }\n.role-list-card { min-height:330px; }\n.role-editor-card { position:sticky; top:18px; }'
          new = '.role-layout { display:block; }\n.role-list-card { min-height:0; margin-bottom:18px; }\n.role-list-card table { min-width:760px; }\n.role-editor-card { position:static; }'
          if s.count(old) != 1:
              raise SystemExit(f'expected one role layout block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit layout change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/akses.html
          git commit -m "Give access role table its own full-width row"
          git push origin "HEAD:${GITHUB_REF_NAME}"
