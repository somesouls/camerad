name: Clean landing CSS

on:
  push:
    branches:
      - refactor/landing-css-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate CSS and improve font rendering
        run: |
          cat > /tmp/cleanup_landing.py <<'PY'
          from collections import OrderedDict
          from pathlib import Path
          import re

          CSS = Path('static/landing/landing.css')
          HTML = Path('templates/landing/landing.html')
          TESTS = Path('tests/test_landing.py')

          def matching_brace(text, opening):
              depth, quote, escaped, i = 1, None, False, opening + 1
              while i < len(text):
                  if quote:
                      if escaped:
                          escaped = False
                      elif text[i] == '\\':
                          escaped = True
                      elif text[i] == quote:
                          quote = None
                  elif text.startswith('/*', i):
                      end = text.find('*/', i + 2)
                      if end < 0:
                          raise ValueError('Unclosed CSS comment')
                      i = end + 1
                  elif text[i] in "'\"":
                      quote = text[i]
                  elif text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise ValueError('Unclosed CSS block')

          def split_declarations(body):
              parts, start, depth, quote, escaped = [], 0, 0, None, False
              for i, ch in enumerate(body):
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  elif ch in "'\"":
                      quote = ch
                  elif ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth = max(0, depth - 1)
                  elif ch == ';' and depth == 0:
                      parts.append(body[start:i])
                      start = i + 1
              parts.append(body[start:])
              result = OrderedDict()
              for part in parts:
                  if ':' not in part:
                      continue
                  name, value = part.split(':', 1)
                  name, value = name.strip(), value.strip()
                  if name and value:
                      result[name] = value
              return result

          def parse_nodes(text):
              nodes, i, size = [], 0, len(text)
              while i < size:
                  while i < size and text[i].isspace():
                      i += 1
                  if text.startswith('/*', i):
                      end = text.find('*/', i + 2)
                      if end < 0:
                          raise ValueError('Unclosed CSS comment')
                      i = end + 2
                      continue
                  if i >= size:
                      break
                  opening = text.find('{', i)
                  if opening < 0:
                      break
                  header = text[i:opening].strip()
                  closing = matching_brace(text, opening)
                  body = text[opening + 1:closing]
                  if header.startswith('@media'):
                      nodes.append({'kind': 'media', 'header': header, 'children': parse_nodes(body)})
                  elif header.startswith('@keyframes') or header.startswith('@-'):
                      nodes.append({'kind': 'raw', 'header': header, 'body': body.strip()})
                  else:
                      nodes.append({'kind': 'rule', 'header': header, 'decls': split_declarations(body)})
                  i = closing + 1
              return nodes

          root_only = re.compile(r'^:root(?:\[data-theme="(?:light|dark)"\]|:not\(\[data-theme\]\))?$')

          def remove_variable_roots(nodes):
              cleaned = []
              for node in nodes:
                  if node['kind'] == 'rule' and root_only.fullmatch(node['header']):
                      continue
                  if node['kind'] == 'media':
                      node = {**node, 'children': remove_variable_roots(node['children'])}
                  cleaned.append(node)
              return cleaned

          def merge_decls(first, second):
              merged = OrderedDict(first)
              for key, value in second.items():
                  merged[key] = value
              return merged

          def consolidate(nodes):
              output, positions = [], {}
              for node in nodes:
                  if node['kind'] == 'media':
                      node = {**node, 'children': consolidate(node['children'])}
                  key = None
                  if node['kind'] == 'rule':
                      key = ('rule', node['header'])
                  elif node['kind'] == 'media':
                      key = ('media', node['header'])
                  if key in positions:
                      old_index = positions[key]
                      old = output[old_index]
                      output[old_index] = None
                      if node['kind'] == 'rule':
                          node = {**node, 'decls': merge_decls(old['decls'], node['decls'])}
                      else:
                          node = {**node, 'children': consolidate(old['children'] + node['children'])}
                  if key:
                      positions[key] = len(output)
                  output.append(node)
              return [node for node in output if node is not None]

          dark = OrderedDict([
              ('color-scheme', 'dark'),
              ('--lp-font', 'Arial, "Helvetica Neue", Helvetica, sans-serif'),
              ('--lp-label-font', 'Arial, "Helvetica Neue", Helvetica, sans-serif'),
              ('--lp-max', '1200px'), ('--lp-radius-sm', '12px'), ('--lp-radius', '22px'), ('--lp-radius-lg', '36px'),
              ('--lp-bg', '#23231a'), ('--lp-bg-soft', '#2d2c22'), ('--lp-surface', 'rgba(45,44,34,.82)'),
              ('--lp-surface-strong', '#39372b'), ('--lp-text', '#f7eee4'), ('--lp-heading-text', '#fff8f0'),
              ('--lp-body-text', '#d6cabc'), ('--lp-muted', '#bdb09e'), ('--lp-subtle-text', '#b5a895'),
              ('--lp-dim', '#948878'), ('--lp-micro-text', '#c9bba8'), ('--lp-line', 'rgba(247,238,228,.14)'),
              ('--lp-primary', '#8d4b2d'), ('--lp-secondary', '#b7c99a'), ('--lp-accent-text', '#d89a77'),
              ('--lp-pink', '#c8754e'), ('--lp-green', '#b7c99a'), ('--lp-yellow', '#d8b56c'), ('--lp-on-accent', '#fffaf5'),
              ('--lp-nav-bg', 'rgba(35,35,26,.88)'), ('--lp-console-bg', 'rgba(38,37,28,.96)'),
              ('--lp-soft-fill', 'rgba(141,75,45,.14)'), ('--lp-grid-line', 'rgba(247,238,228,.04)'),
              ('--lp-glow-primary', 'rgba(141,75,45,.32)'), ('--lp-glow-secondary', 'rgba(183,201,154,.14)'),
              ('--lp-glow-warm', 'rgba(200,117,78,.16)'),
              ('--lp-gradient', 'linear-gradient(110deg,#8d4b2d,#c8754e 55%,#d8a15f)'),
              ('--lp-gradient-radial', 'radial-gradient(circle,#c8754e,#2d2c22 52%,#b7c99a)'),
              ('--lp-shadow', '0 28px 90px rgba(10,10,7,.52)'),
          ])
          light = OrderedDict([
              ('color-scheme', 'light'), ('--lp-bg', '#ffe8d1'), ('--lp-bg-soft', '#f7d3b2'),
              ('--lp-surface', 'rgba(255,247,237,.84)'), ('--lp-surface-strong', '#fff7ed'),
              ('--lp-text', '#2d2018'), ('--lp-heading-text', '#271a12'), ('--lp-body-text', '#4c372a'),
              ('--lp-muted', '#735a48'), ('--lp-subtle-text', '#6f5341'), ('--lp-dim', '#8b6e59'),
              ('--lp-micro-text', '#765b49'), ('--lp-line', 'rgba(78,46,29,.14)'),
              ('--lp-primary', '#d84a05'), ('--lp-secondary', '#2f6f64'), ('--lp-accent-text', '#9f3604'),
              ('--lp-pink', '#a63300'), ('--lp-green', '#2f6f64'), ('--lp-yellow', '#8f5a00'), ('--lp-on-accent', '#ffffff'),
              ('--lp-nav-bg', 'rgba(255,232,209,.9)'), ('--lp-console-bg', 'rgba(255,247,237,.96)'),
              ('--lp-soft-fill', 'rgba(216,74,5,.09)'), ('--lp-grid-line', 'rgba(78,46,29,.05)'),
              ('--lp-glow-primary', 'rgba(216,74,5,.2)'), ('--lp-glow-secondary', 'rgba(47,111,100,.13)'),
              ('--lp-glow-warm', 'rgba(166,51,0,.12)'),
              ('--lp-gradient', 'linear-gradient(110deg,#d84a05,#ed6d2f 55%,#a63300)'),
              ('--lp-gradient-radial', 'radial-gradient(circle,#fff7ed,rgba(216,74,5,.18) 50%,rgba(47,111,100,.14))'),
              ('--lp-shadow', '0 24px 70px rgba(78,46,29,.15)'),
          ])

          canonical = [
              {'kind': 'rule', 'header': ':root', 'decls': dark},
              {'kind': 'rule', 'header': ':root[data-theme="light"]', 'decls': light},
              {'kind': 'media', 'header': '@media (prefers-color-scheme: light)', 'children': [
                  {'kind': 'rule', 'header': ':root:not([data-theme])', 'decls': light.copy()}
              ]},
          ]

          nodes = remove_variable_roots(parse_nodes(CSS.read_text(encoding='utf-8')))
          nodes = consolidate(canonical + nodes)

          palette_map = {
              '#050510': 'var(--lp-on-accent)', '#060611': 'var(--lp-console-bg)', '#0b0b1d': 'var(--lp-surface-strong)',
              'rgba(9,9,26,.9)': 'var(--lp-console-bg)', 'rgba(7,7,20,.74)': 'var(--lp-nav-bg)',
              'rgba(12,12,30,.75)': 'var(--lp-nav-bg)', 'rgba(14,15,37,.84)': 'var(--lp-surface)',
          }

          def modernize_value(prop, value):
              value = value.replace('var(--lp-mono)', 'var(--lp-label-font)')
              for old, new in palette_map.items():
                  value = value.replace(old, new)
              def semantic_rgba(match):
                  red, green, blue, alpha = match.groups()
                  rgb = (int(red), int(green), int(blue))
                  token = {(124,92,255): '--lp-primary', (0,229,255): '--lp-secondary', (88,246,173): '--lp-green'}.get(rgb)
                  if not token:
                      return match.group(0)
                  amount = max(1, min(100, round(float(alpha) * 100)))
                  return f'color-mix(in srgb,var({token}) {amount}%,transparent)'
              value = re.sub(r'rgba\((124|0|88),(92|229|246),(255|255|173),([0-9.]+)\)', semantic_rgba, value)
              value = re.sub(r'font-size:([789])px', 'font-size:10px', value)
              value = re.sub(r'(^|\s)([789])px(?=\s|/|$)', lambda m: m.group(1) + '10px', value)
              for old, new in [('950','700'), ('800','700'), ('760','700'), ('750','700'), ('720','700'), ('680','600'), ('650','600'), ('620','600')]:
                  if prop in ('font', 'font-weight'):
                      value = re.sub(rf'(?<!\d){old}(?!\d)', new, value)
              return value

          def modernize(nodes):
              for node in nodes:
                  if node['kind'] == 'rule':
                      node['decls'] = OrderedDict((prop, modernize_value(prop, value)) for prop, value in node['decls'].items())
                      if node['header'] == 'body':
                          node['decls'].pop('text-rendering', None)
                          node['decls'].pop('-webkit-font-smoothing', None)
                          node['decls']['font-variant-ligatures'] = 'none'
                      if node['header'] == '.lp-stack-row span' and 'font-size' in node['decls']:
                          node['decls']['font-size'] = '10px'
                  elif node['kind'] == 'media':
                      modernize(node['children'])
          modernize(nodes)

          def render_rule(node, indent=''):
              readable = node['header'].startswith(':root')
              if readable:
                  lines = [f"{indent}{node['header']} {{"]
                  lines.extend(f"{indent}  {key}: {value};" for key, value in node['decls'].items())
                  lines.append(f'{indent}}}')
                  return '\n'.join(lines)
              declarations = ';'.join(f'{key}:{value}' for key, value in node['decls'].items())
              return f"{indent}{node['header']}{{{declarations}}}"

          def render(nodes, indent=''):
              chunks = []
              for node in nodes:
                  if node['kind'] == 'rule':
                      chunks.append(render_rule(node, indent))
                  elif node['kind'] == 'media':
                      chunks.append(f"{indent}{node['header']} {{\n{render(node['children'], indent + '  ')}\n{indent}}}")
                  else:
                      chunks.append(f"{indent}{node['header']}{{{node['body']}}}")
              return '\n'.join(chunks)

          output = '/* LANDING TOKENS: CANONICAL EARTH THEME */\n' + render(nodes).strip() + '\n'
          forbidden = ('#050510', '#7c5cff', '#00e5ff', '#ff3cac', '#58f6ad', '--lp-mono', 'Segoe UI Variable', 'Aptos')
          for value in forbidden:
              if value in output:
                  raise SystemExit(f'Legacy token remains: {value}')
          if len(re.findall(r'(?m)^:root\s*\{', output)) != 1:
              raise SystemExit('Expected exactly one canonical :root block')
          if output.count(':root[data-theme="light"]') != 1:
              raise SystemExit('Expected exactly one explicit light theme block')
          if len(output.splitlines()) > 400:
              raise SystemExit('Clean stylesheet exceeds 400-line policy')
          CSS.write_text(output, encoding='utf-8')

          html = HTML.read_text(encoding='utf-8')
          old_url = '/static/landing/landing.css?v=earth-type-20260922'
          new_url = '/static/landing/landing.css?v=earth-clean-20260922'
          if html.count(old_url) != 1:
              raise SystemExit('Unexpected landing CSS URL')
          HTML.write_text(html.replace(old_url, new_url, 1), encoding='utf-8')

          tests = TESTS.read_text(encoding='utf-8')
          tests = tests.replace(old_url, new_url)
          tests = tests.replace('LANDING THEME: EARTH TONE', 'LANDING TOKENS: CANONICAL EARTH THEME')
          tests = tests.replace('LANDING TYPOGRAPHY & DETAIL COLOR SYSTEM', 'LANDING TOKENS: CANONICAL EARTH THEME')
          tests += '''\n\nclass LandingCssCleanupContractTest(unittest.TestCase):\n    def test_theme_tokens_are_canonical_and_fonts_are_readable(self):\n        import re\n        css = (ROOT / "static/landing/landing.css").read_text(encoding="utf-8")\n        self.assertEqual(len(re.findall(r"(?m)^:root\\s*\\{", css)), 1)\n        self.assertEqual(css.count(':root[data-theme="light"]'), 1)\n        self.assertIn('--lp-font: Arial, "Helvetica Neue", Helvetica, sans-serif', css)\n        self.assertIn('--lp-label-font: Arial, "Helvetica Neue", Helvetica, sans-serif', css)\n        self.assertIn('font-variant-ligatures:none', css)\n        for legacy in ('#050510', '#7c5cff', '#00e5ff', '#ff3cac', '#58f6ad', '--lp-mono', 'Segoe UI Variable', 'Aptos'):\n            self.assertNotIn(legacy, css)\n'''
          TESTS.write_text(tests, encoding='utf-8')
          PY
          python /tmp/cleanup_landing.py
      - name: Verify cleaned landing stylesheet
        run: |
          python scripts/oneoff/check_structure.py
          python -m unittest tests.test_landing
      - name: Commit cleanup
        run: |
          rm .github/workflows/cleanup-landing-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/landing/landing.css templates/landing/landing.html tests/test_landing.py .github/workflows/cleanup-landing-css.yml
          git commit -m "refactor: consolidate landing theme and typography"
          git push origin "HEAD:${GITHUB_REF_NAME}"
