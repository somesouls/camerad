name: Rebuild access page UX v2

on:
  push:
    branches:
      - improve/akses-ui-ux

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild access page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/rebuild_akses_ui.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          if lines and lines[-1].strip() == "'''":
              p.write_text('\n'.join(lines[:-1]) + '\n', encoding='utf-8')
          PY
          python3 tools/rebuild_akses_ui.py
      - name: Commit redesigned template
        run: |
          if git diff --quiet -- templates/akses.html; then
            echo "No template changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/akses.html
          git commit -m "Improve access management UI and UX"
          git push origin "HEAD:${GITHUB_REF_NAME}"
