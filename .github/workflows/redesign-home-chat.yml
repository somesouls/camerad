name: redesign-home-chat
on:
  push:
    branches: [redesign/home-chat]
    paths: [tools/redesign_home_chat.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/home-chat
          fetch-depth: 0
      - name: Extract logic and apply redesign
        run: python tools/redesign_home_chat.py
      - name: Validate contracts
        run: |
          python -m unittest tests.test_home_chat
          python scripts/oneoff/check_structure.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html static/app/home.js
          git commit -m "Terapkan halaman utama chat baru"
          git push
