name: Run landing live contrast

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/landing-live-css-contrast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Extract live CSS patch
        run: |
          awk '/^          python - <<'"'"'PY'"'"'$/{capture=1; next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' .github/workflows/apply-landing-live-contrast.yml > /tmp/apply_live_contrast.py
      - name: Apply live CSS patch
        id: patch
        continue-on-error: true
        run: |
          python /tmp/apply_live_contrast.py > /tmp/live-contrast.log 2>&1
          python scripts/oneoff/check_structure.py >> /tmp/live-contrast.log 2>&1
          python -m unittest tests.test_landing >> /tmp/live-contrast.log 2>&1
      - name: Save diagnostics
        if: steps.patch.outcome == 'failure'
        run: |
          git reset --hard HEAD
          cp /tmp/live-contrast.log docs/changelog/landing-live-css-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog/landing-live-css-error.log
          git commit -m "ci: capture live CSS patch failure"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Commit live CSS changes
        if: steps.patch.outcome == 'success'
        run: |
          rm -f .github/workflows/apply-landing-live-contrast.yml .github/workflows/run-landing-live-contrast.yml docs/changelog/landing-live-css-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static/landing/landing.css templates/landing/landing.html routes/landing_routes.py tests/test_landing.py docs/changelog .github/workflows
          git commit -m "fix: serve live landing CSS with stronger contrast"
          git push origin "HEAD:${{ github.head_ref }}"
