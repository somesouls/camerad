name: Run landing live contrast

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/landing-live-css-contrast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Extract and correct live CSS patch
        run: |
          awk '/^          python - <<'"'"'PY'"'"'$/{capture=1; next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' .github/workflows/apply-landing-live-contrast.yml > /tmp/apply_live_contrast.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_live_contrast.py')
          script = path.read_text(encoding='utf-8')
          start = script.index("route = route_path.read_text(encoding='utf-8')")
          end = script.index("tests = test_path.read_text(encoding='utf-8')")
          replacement = '''route = route_path.read_text(encoding='utf-8')
          if 'import time\\n' not in route:
              route = route.replace('from urllib.parse import quote\\n', 'import time\\nfrom urllib.parse import quote\\n', 1)
          old_return = '        return HTMLResponse(_load_html("landing/landing.html"))'
          new_return = ''' + '"""' + '''        landing_html = _load_html("landing/landing.html")
                  landing_html = landing_html.replace(
                      "contrast-live-20260922-1",
                      f"contrast-live-{time.time_ns()}",
                  )
                  return HTMLResponse(
                      landing_html,
                      headers={"Cache-Control": "no-store, no-cache, must-revalidate, max-age=0"},
                  )''' + '"""' + '''
          if route.count(old_return) != 1:
              raise SystemExit('Unexpected landing HTML response')
          route_path.write_text(route.replace(old_return, new_return, 1), encoding='utf-8')

          '''
          path.write_text(script[:start] + replacement + script[end:], encoding='utf-8')
          PY
      - name: Apply live CSS patch
        id: patch
        continue-on-error: true
        run: |
          python /tmp/apply_live_contrast.py > /tmp/live-contrast-v2.log 2>&1
          python scripts/oneoff/check_structure.py >> /tmp/live-contrast-v2.log 2>&1
          python -m unittest tests.test_landing >> /tmp/live-contrast-v2.log 2>&1
      - name: Save diagnostics
        if: steps.patch.outcome == 'failure'
        run: |
          git reset --hard HEAD
          cp /tmp/live-contrast-v2.log docs/changelog/landing-live-css-error-v2.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog/landing-live-css-error-v2.log
          git commit -m "ci: capture corrected live CSS failure"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Commit live CSS changes
        if: steps.patch.outcome == 'success'
        run: |
          rm -f .github/workflows/apply-landing-live-contrast.yml .github/workflows/run-landing-live-contrast.yml docs/changelog/landing-live-css-error*.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static/landing/landing.css templates/landing/landing.html routes/landing_routes.py tests/test_landing.py docs/changelog .github/workflows
          git commit -m "fix: serve live landing CSS with stronger contrast"
          git push origin "HEAD:${{ github.head_ref }}"
