name: Converter tests
on:
  pull_request:
    paths: ['common/converter_*.py', 'routes/converter_routes.py', 'templates/converter.html', 'static/app/converter.*', 'tests/test_converter*.py', '.github/workflows/converter.yml', 'app_core.py', 'db/menu_catalog.py']
  push:
    branches: [main, feature/converter-text-ocr]
    paths: ['common/converter_*.py', 'routes/converter_routes.py', 'templates/converter.html', 'static/app/converter.*', 'tests/test_converter*.py', '.github/workflows/converter.yml']
permissions:
  contents: read
  pull-requests: write
jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local OCR and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind fonts-dejavu-core
          pip install fastapi httpx python-multipart PyMuPDF Pillow pytesseract
      - name: PDF, native OCR, upload and isolation tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_converter*.py' -v 2>&1 | tee /tmp/converter-tests.log
          node --check static/app/converter.js
          python scripts/oneoff/check_structure.py
      - name: Report converter test failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('/tmp/converter-tests.log')) {
              const log = fs.readFileSync('/tmp/converter-tests.log', 'utf8').slice(-12000);
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Converter test diagnostics:\n```text\n' + log + '\n```'});
            }
