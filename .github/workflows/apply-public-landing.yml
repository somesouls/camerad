name: Apply public landing integration

on:
  push:
    branches:
      - feature/futuristic-public-landing

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate public landing route
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'app_core.py',
              '_PUBLIC_PATHS = {"/login", "/api/login",',
              '_PUBLIC_PATHS = {"/", "/login", "/api/login",',
          )
          replace(
              'app_core.py',
              'if path == "/" or path == "/studio" or path.startswith("/api/studio"):',
              'if path == "/app" or path == "/studio" or path.startswith("/api/studio"):',
          )
          replace(
              'pipeline/routes.py',
              'async def landing(request: Request):\n    """Landing page: chat + akses tools."""\n    return render_page(request, "index.html", "")',
              'async def app_home(request: Request):\n    """Authenticated Camerad home: grounded chat + access to tools."""\n    return render_page(request, "index.html", "")',
          )
          replace(
              'pipeline/routes.py',
              'app.add_api_route("/", landing, methods=["GET"])',
              'app.add_api_route("/app", app_home, methods=["GET"])',
          )
          replace(
              'web_app.py',
              'import routes.system_routes as system_routes\nsystem_routes.register(app)',
              'import routes.system_routes as system_routes\nsystem_routes.register(app)\nimport routes.landing_routes as landing_routes\nlanding_routes.register(app)',
          )
          replace(
              'templates/login.html',
              'const next = params.get("next") || "/";',
              'const next = params.get("next") || "/app";',
          )
          replace(
              '.github/workflows/ci.yml',
              '      - name: Guard struktur (py_compile + anti-shim root)\n        run: python scripts/oneoff/check_structure.py',
              '      - name: Guard struktur (py_compile + anti-shim root)\n        run: python scripts/oneoff/check_structure.py\n      - name: Unit tests\n        run: python -m unittest discover -s tests -p "test_*.py"',
          )
          replace(
              'README.md',
              'Halaman utama `/` berupa **landing page + Chat AI**; tool analisis Step 1–16 ada di route **`/tools`**.',
              'Halaman utama `/` adalah **landing page publik**; setelah login, Chat AI tersedia di **`/app`**, sedangkan tool analisis Step 1–16 tetap di **`/tools`**.',
          )
          PY
      - name: Verify landing contract
        run: |
          python scripts/oneoff/check_structure.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_core.py pipeline/routes.py web_app.py templates/login.html README.md .github/workflows/ci.yml
          git commit -m "feat: route public landing and authenticated app home"
          git push origin "HEAD:${GITHUB_REF_NAME}"
