name: Polish access editor focus

on:
  push:
    branches:
      - improve/akses-ui-ux

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve edit focus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('templates/akses.html')
          s = p.read_text(encoding='utf-8')
          old = 'window.scrollTo(0, document.body.scrollHeight);'
          new = 'document.getElementById("rtitle").scrollIntoView({ behavior: "smooth", block: "start" });'
          if s.count(old) != 1:
              raise SystemExit(f'expected one edit-focus call, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit focus polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/akses.html
          git commit -m "Polish access editor focus behavior"
          git push origin "HEAD:${GITHUB_REF_NAME}"
