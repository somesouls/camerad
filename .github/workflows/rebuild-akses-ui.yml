name: Rebuild access page UX

on:
  push:
    branches:
      - improve/akses-ui-ux

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild access page
        run: python3 tools/rebuild_akses_ui.py
      - name: Commit redesigned template
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/akses.html
          git commit -m "Improve access management UI and UX"
          git push origin "HEAD:${GITHUB_REF_NAME}"
