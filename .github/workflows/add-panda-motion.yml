name: add-panda-motion
on:
  push:
    branches: [feature/landing-panda-motion]
    paths: [tools/add_panda_motion.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/landing-panda-motion
          fetch-depth: 0
      - name: Add standalone panda motion section
        run: python tools/add_panda_motion.py
      - name: Validate
        run: |
          python -m unittest tests.test_panda_motion
          python -m unittest tests.test_landing
          python scripts/oneoff/check_structure.py
      - name: Commit generated template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/landing/landing.html
          git commit -m "Pasang motion graphic panda di landing"
          git push
