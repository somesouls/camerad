<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Camerad Studio{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>

:root {
  --bg-base: #030712;
  --bg-grad-1: #0f172a;
  --bg-grad-2: #020617;
  --panel-bg: rgba(15, 23, 42, 0.7);
  --panel-border: rgba(51, 65, 85, 0.6);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-glow: rgba(59, 130, 246, 0.2);
  --bubble-user: rgba(30, 41, 59, 0.6);
  --grid-color: rgba(255, 255, 255, 0.03);
  --shadow-float: 0 10px 40px rgba(0,0,0,0.5);
  --c-blue: rgba(59,130,246,0.15); --c-blue-txt: #60a5fa;
  --c-green: rgba(16,185,129,0.15); --c-green-txt: #34d399;
  --c-orange: rgba(245,158,11,0.15); --c-orange-txt: #fbbf24;
  --c-purple: rgba(139,92,246,0.15); --c-purple-txt: #a78bfa;
  --c-red: rgba(239,68,68,0.15); --c-red-txt: #f87171;
}

[data-theme="light"] {
  --bg-base: #f8fafc;
  --bg-grad-1: #e2e8f0;
  --bg-grad-2: #f1f5f9;
  --panel-bg: rgba(255, 255, 255, 0.85);
  --panel-border: rgba(203, 213, 225, 0.8);
  --text-main: #0f172a;
  --text-muted: #475569;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-glow: rgba(37, 99, 235, 0.15);
  --bubble-user: rgba(255, 255, 255, 0.9);
  --grid-color: rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 40px rgba(0,0,0,0.08);
  --c-blue: #eff6ff; --c-blue-txt: #2563eb;
  --c-green: #ecfdf5; --c-green-txt: #10b981;
  --c-orange: #fffbeb; --c-orange-txt: #f59e0b;
  --c-purple: #f5f3ff; --c-purple-txt: #8b5cf6;
  --c-red: #fef2f2; --c-red-txt: #ef4444;
}

* { box-sizing: border-box; transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-base);
  background: radial-gradient(circle at 15% 50%, var(--accent-glow), transparent 25%),
              linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
  color: var(--text-main); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden;
}
.grid-bg {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background-size: 40px 40px;
  background-image: 
    linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
  z-index: -1; pointer-events: none;
}
.app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

.side { 
  background: var(--panel-bg); 
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--panel-border); 
  display: flex; flex-direction: column; z-index: 20; 
}
.side-top { padding: 20px 16px 12px; }
.side .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.side .logo { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex: none; }
.side .logo svg { width: 20px; height: 20px; }
.side .brand b { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
.side .brand span { display: block; font-size: 12px; color: var(--text-muted); }
.newbtn { 
  width: 100%; height: 44px; display: flex; align-items: center; justify-content: space-between; 
  padding: 0 16px; border: 1px solid var(--panel-border); background: transparent; 
  color: var(--text-main); border-radius: 12px; font-size: 14px; font-weight: 600; 
  cursor: pointer; transition: 0.2s; 
}
.newbtn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.newbtn svg { width: 18px; height: 18px; flex-shrink: 0; }
.side-scroll { flex: 1; overflow-y: auto; padding: 12px 12px 20px; }
.side-scroll::-webkit-scrollbar { width: 4px; }
.side-scroll::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
.sec-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 16px 8px 8px; }
.sec-label.acc-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; border-radius: 8px; transition: color 0.2s; }
.sec-label.acc-toggle:hover { color: var(--text-main); }
.acc-chev { display: inline-flex; opacity: 0.6; transition: transform 0.2s; }
.acc-chev svg { width: 12px; height: 12px; }
.sec-label.acc-collapsed .acc-chev { transform: rotate(-90deg); }
.tool-side { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; color: var(--text-main); text-decoration: none; transition: 0.2s; border: 1px solid transparent; }
.tool-side:hover { background: var(--panel-border); border-color: var(--accent-glow); transform: translateX(3px); }
.tool-side .ic { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; }
.tool-side b { font-size: 13.5px; font-weight: 600; }
.chat-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--text-muted); font-size: 13.5px; position: relative; transition: 0.2s; margin-bottom: 2px; }
.chat-item:hover { background: var(--panel-border); color: var(--text-main); }
.chat-item.active { background: var(--accent-glow); color: var(--accent); font-weight: 500; border-left: 3px solid var(--accent); border-radius: 4px 10px 10px 4px; }
.chat-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item .del { opacity: 0; border: none; background: transparent; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; flex: none; transition: 0.2s; }
.chat-item:hover .del { opacity: 1; }
.chat-item .del:hover { color: #ef4444; background: rgba(239,68,68,0.15); }
.empty-hist { padding: 10px 12px; color: var(--text-muted); font-size: 13px; font-style: italic; }
.side-foot { border-top: 1px solid var(--panel-border); padding: 14px 16px; font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
.side-foot .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); } 70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
.main { display: flex; flex-direction: column; height: 100vh; position: relative; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; z-index: 10; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.menu-btn { border: 1px solid var(--panel-border); background: var(--panel-bg); color: var(--text-main); width: 40px; height: 40px; border-radius: 10px; display: none; align-items: center; justify-content: center; cursor: pointer; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.user-info { text-align: right; display: flex; flex-direction: column; justify-content: center; }
.user-info b { font-size: 14px; font-weight: 600; line-height: 1.2; }
.user-info span { font-size: 11.5px; color: var(--text-muted); }
.user-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; box-shadow: 0 4px 10px var(--accent-glow); overflow: hidden; }
.user-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.action-btn { border: 1px solid var(--panel-border); background: var(--panel-bg); backdrop-filter: blur(10px); color: var(--text-main); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
.action-btn:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); transform: translateY(-2px); }
.btn-logout:hover { border-color: #ef4444; color: #ef4444; box-shadow: 0 0 15px rgba(239,68,68,0.2); }
.icon-moon { display: none; }
.icon-sun { display: block; }
[data-theme="light"] .icon-moon { display: block; }
[data-theme="light"] .icon-sun { display: none; }
.stream { flex: 1; overflow-y: auto; scroll-behavior: smooth; display: flex; flex-direction: column; }
.stream-inner { max-width: 840px; margin: 0 auto; width: 100%; padding: 0 20
