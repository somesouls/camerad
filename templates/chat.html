<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat - Agen Hebat</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f5; margin: 0; }

        /* Tombol Melayang */
        .chat-bot-icon {
            position: fixed; bottom: 20px; right: 20px; height: 60px; width: 60px;
            background: linear-gradient(135deg, #1976d2, #1565c0);
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 9999; color: white;
        }

        /* Container Chat */
        .chat-screen {
            position: fixed; bottom: 90px; right: 20px; width: 350px; height: 500px;
            background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; overflow: hidden;
            transform: scale(0); transform-origin: bottom right; transition: all 0.3s ease;
            z-index: 9998;
        }
        .chat-screen.show { transform: scale(1); }

        /* Header */
        .chat-header {
            background: #1976d2; color: white; padding: 15px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { cursor: pointer; font-weight: bold; }

        /* Area Obrolan */
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #fafafa; }
        .pesan { margin-bottom: 15px; padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .pesan.bot { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 2px; }
        .pesan.user { background: #1976d2; color: white; margin-left: auto; border-bottom-right-radius: 2px; }

        /* Gelembung ACK (menunggu jawaban RAG) -> gaya netral */
        .pesan.bot.menunggu { background: #eceff1; color: #546e7a; font-style: italic; }

        /* Balasan FALLBACK (bukan dari mesin RAG) -> gaya berbeda */
        .pesan.bot.fallback { background: #fff3e0; color: #e65100; border: 1px dashed #ffb74d; }

        /* Meta waktu respons (kecil, di bawah balasan bot) */
        .meta-waktu { font-size: 11px; color: #90a4ae; margin: -8px 0 15px 4px; }
        .meta-waktu.fallback { color: #ef6c00; }

        /* Indikator "sedang mengetik" */
        .typing { display: inline-flex; align-items: center; gap: 4px; }
        .typing .dot {
            width: 7px; height: 7px; border-radius: 50%; background: #64b5f6;
            animation: blink 1.2s infinite ease-in-out both;
        }
        .typing .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

        /* Area Input */
        .chat-input {
            padding: 10px; border-top: 1px solid #ddd; display: flex; background: white;
        }
        .chat-input input {
            flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none;
        }
        .chat-input button {
            background: #1976d2; color: white; border: none; padding: 10px 15px;
            margin-left: 10px; border-radius: 50%; cursor: pointer;
        }
        .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Tombol Melayang -->
    <div class="chat-bot-icon" id="chat-toggle">💬</div>

    <!-- Container Chat -->
    <div class="chat-screen" id="chat-screen">
        <div class="chat-header">
            <span>Live Chat Pajak</span>
            <span class="close-btn" id="chat-close">✖</span>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="pesan bot">Halo Kawan Pajak! Ada yang bisa saya bantu hari ini?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="input-pesan" placeholder="Ketik pesan Anda...">
            <button id="btn-kirim">➤</button>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('chat-toggle');
        const closeBtn = document.getElementById('chat-close');
        const chatScreen = document.getElementById('chat-screen');
        const chatBody = document.getElementById('chat-body');
        const inputPesan = document.getElementById('input-pesan');
        const btnKirim = document.getElementById('btn-kirim');

        toggleBtn.addEventListener('click', () => chatScreen.classList.add('show'));
        closeBtn.addEventListener('click', () => chatScreen.classList.remove('show'));

        // Konfigurasi Opsi B
        const API = 'https://api.agenthebat.com';
        const SENTINEL_POLL = '__CAMERAD_POLL__'; // harus sama dgn backend
        const POLL_INTERVAL = 1500;               // jeda antar-poll (ms)
        const POLL_MAX = 40;                      // batas percobaan (~60 dtk)

        const sessionId = "wp-" + Math.random().toString(36).substr(2, 9);

        function scrollBawah() { chatBody.scrollTop = chatBody.scrollHeight; }

        function tampilkanMengetik() {
            const el = document.createElement('div');
            el.className = 'pesan bot typing-wrap';
            el.innerHTML = '<span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
            chatBody.appendChild(el);
            scrollBawah();
            return el;
        }

        // Meta: tampilkan durasi backend (pesan masuk -> jawaban siap) + total layar
        function tambahMeta(durasiBackend, durasiTotal, isFallback) {
            const meta = document.createElement('div');
            meta.className = 'meta-waktu' + (isFallback ? ' fallback' : '');
            let t = '';
            if (durasiBackend !== null && durasiBackend !== undefined) {
                t += '⏱ backend ' + Number(durasiBackend).toFixed(2) + ' dtk (pesan masuk → jawaban siap)';
            }
            if (durasiTotal !== null && durasiTotal !== undefined) {
                t += (t ? ' · ' : '⏱ ') + 'layar ' + Number(durasiTotal).toFixed(2) + ' dtk';
            }
            if (isFallback) t += ' · ⚠ jawaban cadangan (bukan dari mesin RAG)';
            meta.textContent = t;
            chatBody.appendChild(meta);
            scrollBawah();
        }

        function selesaikan() {
            btnKirim.disabled = false;
            inputPesan.disabled = false;
            inputPesan.focus();
            scrollBawah();
        }

        function tampilkanJawaban(el, data, t0) {
            el.classList.remove('typing-wrap', 'menunggu');
            el.textContent = (data && data.reply) ? data.reply : '(balasan kosong dari server)';
            if (data && data.is_fallback) el.classList.add('fallback');
            const total = (performance.now() - t0) / 1000;
            tambahMeta(data ? data.durasi_backend : null, total, !!(data && data.is_fallback));
        }

        async function kirimPesan() {
            const teks = inputPesan.value.trim();
            if (!teks) return;

            const userEl = document.createElement('div');
            userEl.className = 'pesan user';
            userEl.textContent = teks;
            chatBody.appendChild(userEl);
            inputPesan.value = "";
            scrollBawah();

            btnKirim.disabled = true;
            inputPesan.disabled = true;
            const t0 = performance.now();
            const mengetikEl = tampilkanMengetik();

            try {
                const resp = await fetch(API + '/api/chat/detect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: teks, session_id: sessionId })
                });
                const data = await resp.json();

                if (data && data.error) {
                    mengetikEl.classList.remove('typing-wrap');
                    mengetikEl.classList.add('fallback');
                    mengetikEl.textContent = 'Error: ' + data.error;
                    tambahMeta(null, (performance.now() - t0) / 1000, true);
                    return selesaikan();
                }

                if (data && data.ready) {
                    // Fast-path: jawaban langsung siap (mis. mode cepat).
                    tampilkanJawaban(mengetikEl, data, t0);
                    return selesaikan();
                }

                // PENDING (Opsi B): gelembung ACK jadi bubble ke-1, lalu polling
                // giliran echo untuk mengambil jawaban (bubble ke-2).
                mengetikEl.classList.remove('typing-wrap');
                mengetikEl.classList.add('menunggu');
                mengetikEl.textContent = (data && data.reply) ? data.reply : '⏳ Mohon tunggu sebentar…';
                const typing2 = tampilkanMengetik();
                pollJawaban(t0, typing2, 0);
            } catch (err) {
                mengetikEl.classList.remove('typing-wrap');
                mengetikEl.classList.add('fallback');
                mengetikEl.textContent = 'Koneksi terputus.';
                tambahMeta(null, (performance.now() - t0) / 1000, true);
                selesaikan();
            }
        }

        // Giliran echo: kirim sentinel lewat Dialogflow (tetap terekam) sampai
        // jawaban RAG siap, lalu tampilkan di bubble ke-2.
        function pollJawaban(t0, typingEl, attempt) {
            if (attempt >= POLL_MAX) {
                typingEl.classList.remove('typing-wrap');
                typingEl.classList.add('fallback');
                typingEl.textContent = 'Maaf, jawaban terlalu lama disiapkan. Silakan coba lagi.';
                tambahMeta(null, (performance.now() - t0) / 1000, true);
                return selesaikan();
            }
            setTimeout(async () => {
                try {
                    const resp = await fetch(API + '/api/chat/detect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: SENTINEL_POLL, session_id: sessionId })
                    });
                    const data = await resp.json();
                    if (data && data.ready) {
                        tampilkanJawaban(typingEl, data, t0);
                        return selesaikan();
                    }
                    pollJawaban(t0, typingEl, attempt + 1);
                } catch (err) {
                    pollJawaban(t0, typingEl, attempt + 1);
                }
            }, POLL_INTERVAL);
        }

        btnKirim.addEventListener('click', kirimPesan);
        inputPesan.addEventListener('keypress', (e) => { if (e.key === 'Enter') kirimPesan(); });
    </script>
</body>
</html>
