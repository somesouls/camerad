{% extends "base.html" %}
{% block title %}Analisis Pengguna Harian · AWE{% endblock %}
{% block head %}
<style>
  .awe-wrap{max-width:1180px;margin:0 auto;padding:22px 26px 60px;}
  .awe-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .awe-title{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .awe-sub{color:var(--text-muted,#8a8f98);font-size:12.5px;margin-top:4px;}
  .awe-tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .seg{display:flex;background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:12px;overflow:hidden;}
  .seg button{border:none;background:transparent;color:var(--text-muted,#8a8f98);padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .seg button.active{background:var(--accent-glow,rgba(90,120,255,.16));color:var(--accent,#5a78ff);}
  .cust{display:none;gap:6px;align-items:center;}
  .cust.show{display:flex;}
  .cust input{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:10px;color:var(--text-main,#e8e9ec);padding:7px 9px;font-size:12px;}
  .cust button{background:var(--accent,#5a78ff);color:#fff;border:none;border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:12px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:14px;padding:15px 16px;}
  .kpi .v{font-size:25px;font-weight:800;line-height:1.1;}
  .kpi .l{font-size:11.5px;color:var(--text-muted,#8a8f98);margin-top:3px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:860px){.grid2{grid-template-columns:1fr;}}
  .card{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:14px;padding:15px 17px;margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12px;}
  .bar-row .lab{width:180px;flex:none;color:var(--text-muted,#8a8f98);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .track{flex:1;height:9px;background:var(--panel-border,#2a2b30);border-radius:6px;overflow:hidden;}
  .fill{height:100%;background:var(--accent,#5a78ff);border-radius:6px;}
  .bar-row .num{width:88px;text-align:right;flex:none;}
  table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
  table.tbl th,table.tbl td{padding:8px 9px;border-bottom:1px solid var(--panel-border,#2a2b30);text-align:left;white-space:nowrap;}
  table.tbl th{color:var(--text-muted,#8a8f98);font-weight:600;position:sticky;top:0;background:var(--panel-bg,#1b1c1f);}
  table.tbl th.th-sort{cursor:pointer;}
  table.tbl th.th-sort:hover{color:var(--text-main,#e8e9ec);}
  th.sorted-asc::after{content:" ▲";font-size:8px;}
  th.sorted-desc::after{content:" ▼";font-size:8px;}
  .tbl-wrap{max-height:560px;overflow:auto;}
  .pager{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:12px;}
  .pgbtns{display:flex;align-items:center;gap:5px;}
  .pgb{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);color:var(--text-main,#e8e9ec);border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer;}
  .pgb:disabled{opacity:.4;cursor:default;}
  .perwrap{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .perSel,.tblFilter{background:var(--bg,#111);border:1px solid var(--panel-border,#2a2b30);color:var(--text-main,#e8e9ec);border-radius:8px;padding:5px 8px;font-size:12px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--text-muted,#8a8f98);}
  .legend .lg{display:inline-flex;align-items:center;gap:6px;}
  .legend .lg i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .statgrid .sv{font-size:23px;font-weight:800;line-height:1.1;}
  .statgrid .sl{font-size:11px;color:var(--text-muted,#8a8f98);margin-top:2px;}
  .spark{display:flex;align-items:flex-end;gap:3px;height:80px;}
  .spark .b{flex:1;background:var(--accent,#5a78ff);border-radius:3px 3px 0 0;min-height:2px;opacity:.85;}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(240,90,90,.16);color:#f2726f;}
  .pill.g{background:rgba(12,135,75,.16);color:#33b378;}
  .pill.b{background:rgba(90,120,255,.16);color:var(--accent,#5a78ff);}
  .pill.o{background:rgba(240,163,90,.16);color:#f0a35a;}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700;background:var(--panel-border,#2a2b30);color:var(--text-muted,#8a8f98);}
  .muted{color:var(--text-muted,#8a8f98);}
  .loading{color:var(--text-muted,#8a8f98);padding:34px;text-align:center;}
  .note{font-size:11.5px;color:var(--text-muted,#8a8f98);margin-top:6px;line-height:1.5;}
  .btn-lihat{background:var(--accent,#5a78ff);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-lihat:hover{opacity:.85;}
  .flt{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .flt input,.flt select{background:var(--bg,#111);border:1px solid var(--panel-border,#2a2b30);border-radius:8px;color:var(--text-main,#e8e9ec);padding:6px 9px;font-size:12px;}
  #txModal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);}
  #txModal.open{display:flex;align-items:center;justify-content:center;}
  #txBox{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:16px;width:min(700px,96vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;}
  #txHead{padding:14px 18px;border-bottom:1px solid var(--panel-border,#2a2b30);display:flex;justify-content:space-between;align-items:center;gap:12px;}
  #txTitle{font-weight:700;font-size:14px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #txClose,#txBack{background:transparent;border:none;color:var(--text-muted,#8a8f98);font-size:20px;cursor:pointer;line-height:1;}
  #txBody{padding:14px 18px;overflow-y:auto;flex:1;}
  #txList{padding:10px 14px;overflow-y:auto;flex:1;}
  .cv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--panel-border,#2a2b30);border-radius:9px;margin:6px 0;cursor:pointer;}
  .cv-row:hover{background:var(--bg,#111);}
  .cv-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .cv-top{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cv-sub{font-size:11px;color:var(--text-muted,#8a8f98);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cv-badges{display:flex;align-items:center;gap:6px;flex:none;}
  .tx-bubble{margin-bottom:10px;}
  .tx-role{font-size:10.5px;font-weight:700;margin-bottom:3px;}
  .tx-text{background:var(--bg,#111);border:1px solid var(--panel-border,#2a2b30);border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .role-agent{color:var(--accent,#5a78ff);}
  .role-customer{color:#0c874b;}
  .role-bot{color:#888;}
  #txMeta{padding:8px 18px 12px;border-top:1px solid var(--panel-border,#2a2b30);font-size:11px;color:var(--text-muted,#8a8f98);}
</style>
{% endblock %}
{% block content %}
<div class="awe-wrap" id="aweRoot">
  <div class="awe-head">
    <div>
      <h1 class="awe-title">Analisis Pengguna Harian</h1>
      <div class="awe-sub" id="aweRange">Memuat…</div>
    </div>
    <div class="awe-tb">
      <div class="seg" id="seg">
        <button data-r="today">Hari ini</button>
        <button data-r="yesterday">Kemarin</button>
        <button data-r="7d">7 hari</button>
        <button data-r="30d" class="active">30 hari</button>
        <button data-r="90d">90 hari</button>
        <button data-r="all">Semua</button>
        <button data-r="custom">Kustom</button>
      </div>
      <div class="cust" id="cust">
        <input type="date" id="cStart"><span class="muted">s/d</span><input type="date" id="cEnd">
        <button id="applyCustom">Terapkan</button>
      </div>
    </div>
  </div>
  <div id="aweBody"><div class="loading">Memuat data…</div></div>
</div>

<div id="txModal">
  <div id="txBox">
    <div id="txHead">
      <button id="txBack" title="Kembali ke daftar" style="display:none;">&larr;</button>
      <p id="txTitle">Percakapan</p>
      <button id="txClose" title="Tutup">&times;</button>
    </div>
    <div id="txList" style="display:none;"></div>
    <div id="txBody"><div class="loading">Memuat transkrip…</div></div>
    <div id="txMeta"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var body=document.getElementById('aweBody');
  var rangeEl=document.getElementById('aweRange');
  var state={range:'30d',start:'',end:''};
  var DATA=null;
  var TBL={};
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pct(n,d){return d? Math.round(1000*n/d)/10:0;}
  function empty(){return '<div class="muted">Tidak ada data.</div>';}
  function fmtDur(sec){sec=parseInt(sec||0,10);if(sec<=0)return '–';var m=Math.floor(sec/60),s=sec%60;if(m>=60){var h=Math.floor(m/60);m=m%60;return h+'j '+m+'m';}return m?(m+'m '+(s<10?'0':'')+s+'s'):(s+'s');}
  function bars(items,color){
    var max=1; items.forEach(function(i){if(i.val>max)max=i.val;});
    return items.map(function(i){
      return '<div class="bar-row"><div class="lab" title="'+esc(i.lab)+'">'+esc(i.lab)+'</div>'+
        '<div class="track"><div class="fill" style="width:'+pct(i.val,max)+'%;'+(color?'background:'+color+';':'')+'"></div></div>'+
        '<div class="num">'+i.val+(i.sub?' <span class="muted">'+esc(i.sub)+'</span>':'')+'</div></div>';
    }).join('');
  }
  function card(title,inner){return '<div class="card"><h3>'+esc(title)+'</h3>'+inner+'</div>';}
  function kpi(v,l){return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+esc(l)+'</div></div>';}
  function multiTrend(trend){
    if(!trend||!trend.length) return empty();
    var W=Math.max(trend.length*10,320),H=140,pad=8;
    var maxV=1; trend.forEach(function(t){maxV=Math.max(maxV,t.users||0,t.direct||0,t.anomali||0);});
    var n=trend.length;
    function pts(key){return trend.map(function(t,i){var x=pad+(n<=1?(W-2*pad)/2:(i*(W-2*pad)/(n-1)));var y=H-pad-(H-2*pad)*(t[key]||0)/maxV;return (Math.round(x*10)/10)+','+(Math.round(y*10)/10);}).join(' ');}
    var series=[{k:'users',c:'#5a78ff',l:'Pengguna unik'},{k:'direct',c:'#f2726f',l:'Langsung agent'},{k:'anomali',c:'#f0a35a',l:'Anomali'}];
    var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:150px;display:block;">';
    series.forEach(function(s){svg+='<polyline fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" points="'+pts(s.k)+'"/>';});
    svg+='</svg>';
    var leg=series.map(function(s){return '<span class="lg"><i style="background:'+s.c+'"></i>'+s.l+'</span>';}).join('');
    var span=trend.length?('<span class="lg muted">'+esc(trend[0].day)+' → '+esc(trend[trend.length-1].day)+'</span>'):'';
    return svg+'<div class="legend">'+leg+span+'</div>';
  }

  // ---- Reusable paginated table controller ----
  function regTable(name,cfg){
    var prev=TBL[name]&&TBL[name].state;
    TBL[name]=cfg;
    cfg.state=prev||{q:'',page:1,per:25,sortK:(cfg.defaultSort&&cfg.defaultSort.k)||null,sortDir:(cfg.defaultSort&&cfg.defaultSort.dir)||-1,filter:'all'};
  }
  function computeRows(name){
    var t=TBL[name],st=t.state;
    var list=(t.baseRows()||[]).slice();
    var q=(st.q||'').trim().toLowerCase();
    if(q&&t.searchFields)list=list.filter(function(r){return t.searchFields.some(function(f){return String(r[f]==null?'':r[f]).toLowerCase().indexOf(q)>=0;});});
    if(t.filterFn&&st.filter&&st.filter!=='all')list=list.filter(function(r){return t.filterFn(r,st.filter);});
    if(st.sortK){var k=st.sortK,dir=st.sortDir;list.sort(function(a,b){var x=a[k],y=b[k];if(typeof x==='string'||typeof y==='string'){x=String(x==null?'':x).toLowerCase();y=String(y==null?'':y).toLowerCase();}return x<y?-dir:(x>y?dir:0);});}
    return list;
  }
  function pagerHtml(name,st,total,pages,start,shown){
    if(!total)return '';
    var from=start+1,to=start+shown;
    return '<div class="pager"><span class="muted">'+from+'–'+to+' dari '+total+'</span>'
      +'<span class="pgbtns">'
      +'<button class="pgb" data-tbl="'+name+'" data-act="first"'+(st.page<=1?' disabled':'')+'>«</button>'
      +'<button class="pgb" data-tbl="'+name+'" data-act="prev"'+(st.page<=1?' disabled':'')+'>‹</button>'
      +'<span class="muted">Hal '+st.page+'/'+pages+'</span>'
      +'<button class="pgb" data-tbl="'+name+'" data-act="next"'+(st.page>=pages?' disabled':'')+'>›</button>'
      +'<button class="pgb" data-tbl="'+name+'" data-act="last"'+(st.page>=pages?' disabled':'')+'>»</button>'
      +'</span>'
      +'<span class="perwrap"><label class="muted">Baris/hal</label><select class="perSel" data-tbl="'+name+'"><option'+(st.per===25?' selected':'')+'>25</option><option'+(st.per===50?' selected':'')+'>50</option><option'+(st.per===100?' selected':'')+'>100</option></select></span>'
      +'</div>';
  }
  function renderTbl(name){
    var t=TBL[name]; if(!t)return; var st=t.state;
    var list=computeRows(name);
    var total=list.length;
    var pages=Math.max(1,Math.ceil(total/st.per));
    if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
    var start=(st.page-1)*st.per;
    var pageRows=list.slice(start,start+st.per);
    var tb=document.getElementById(name+'Body');
    if(tb)tb.innerHTML=pageRows.map(t.rowHtml).join('')||'<tr><td colspan="'+t.colspan+'" class="muted">Tidak ada data.</td></tr>';
    var cnt=document.getElementById(name+'Count'); if(cnt)cnt.textContent=total;
    var pg=document.getElementById(name+'Pager'); if(pg)pg.innerHTML=pagerHtml(name,st,total,pages,start,pageRows.length);
    Array.prototype.forEach.call(document.querySelectorAll('th[data-tbl="'+name+'"]'),function(th){
      th.classList.remove('sorted-asc','sorted-desc');
      if(th.getAttribute('data-sort')===st.sortK)th.classList.add(st.sortDir>0?'sorted-asc':'sorted-desc');
    });
  }
  function tblSkeleton(o){
    var flt='<div class="flt"><input class="tblSearch" data-tbl="'+o.name+'" placeholder="'+esc(o.search||'Cari…')+'" style="min-width:240px;">';
    if(o.filterOpts)flt+='<select class="tblFilter" data-tbl="'+o.name+'">'+o.filterOpts+'</select>';
    flt+='<span class="note" style="margin:0;">Klik judul kolom untuk mengurutkan.</span></div>';
    return '<div class="card"><h3>'+esc(o.title)+' — <span id="'+o.name+'Count">0</span> '+esc(o.unit||'baris')+'</h3>'
      +(o.note?'<div class="note" style="margin-top:0;margin-bottom:10px;">'+o.note+'</div>':'')
      +flt
      +'<div class="tbl-wrap"><table class="tbl"><thead><tr>'+o.theadCols+'</tr></thead><tbody id="'+o.name+'Body"></tbody></table></div>'
      +'<div id="'+o.name+'Pager"></div></div>';
  }

  // ---- Row renderers ----
  function userRowHtml(u){
    var n=u.conv||0;
    var lihat=n?'<button class="btn-lihat" data-uidx="'+u._i+'">Lihat ('+n+')</button>':'-';
    var idt=u.idtype==='Nama'?'<span class="tag">Nama</span>':(u.idtype==='Anonim'?'<span class="tag">Anonim</span>':'<span class="pill b">'+esc(u.idtype)+'</span>');
    return '<tr>'
      +'<td>'+esc(u.label)+(u.taxid&&u.name?'<br><span class="muted">'+esc(u.name)+'</span>':'')+'</td>'
      +'<td>'+idt+'</td>'
      +'<td>'+u.conv+'</td>'
      +'<td>'+u.days+'</td>'
      +'<td>'+(u.direct>0?'<span class="pill">'+u.direct+' ('+u.direct_pct+'%)</span>':'0')+'</td>'
      +'<td title="'+esc(u.themes)+'">'+esc(u.themes||'–')+'</td>'
      +'<td>'+esc(u.sentiment)+'</td>'
      +'<td>'+(u.returning?'<span class="pill g">Ya</span>':'–')+'</td>'
      +'<td>'+lihat+'</td></tr>';
  }
  function nnRowHtml(u){
    var n=u.conv||0;
    var lihat=n?'<button class="btn-lihat" data-uidx="'+u._i+'">Lihat ('+n+')</button>':'-';
    return '<tr>'
      +'<td>'+esc(u.label||'(tanpa nama)')+'</td>'
      +'<td>'+u.conv+'</td>'
      +'<td>'+u.days+'</td>'
      +'<td>'+(u.direct>0?'<span class="pill">'+u.direct+' ('+u.direct_pct+'%)</span>':'0')+'</td>'
      +'<td title="'+esc(u.themes)+'">'+esc(u.themes||'–')+'</td>'
      +'<td>'+esc(u.sentiment)+'</td>'
      +'<td>'+lihat+'</td></tr>';
  }
  function anRowHtml(a){
    var n=a.conv||0;
    var lihat=n?'<button class="btn-lihat" data-anom="'+a._i+'">Lihat ('+n+')</button>':'-';
    return '<tr>'
      +'<td>'+esc(a.label||'(kosong)')+'</td>'
      +'<td>'+a.conv+'</td>'
      +'<td>'+(a.direct>0?'<span class="pill">'+a.direct+'</span>':'0')+'</td>'
      +'<td>'+a.days+'</td>'
      +'<td title="'+esc(a.themes)+'">'+esc(a.themes||'–')+'</td>'
      +'<td>'+esc(a.first||'-')+' → '+esc(a.last||'-')+'</td>'
      +'<td>'+lihat+'</td></tr>';
  }
  function causeRowHtml(c){
    return '<tr>'
      +'<td title="'+esc(c.theme)+'">'+esc(c.theme)+'</td>'
      +'<td>'+c.users+'</td>'
      +'<td><span class="pill">'+c.direct+'</span></td>'
      +'<td>'+c.pct+'%</td>'
      +'<td>'+(c.neg_pct>0?'<span class="pill">'+c.neg_pct+'%</span>':'0%')+'</td>'
      +'<td>'+(c.poro||0)+'</td>'
      +'<td>'+fmtDur(c.avg_dur)+'</td></tr>';
  }

  // ---- Transcript modal (2 levels) ----
  var txModal=document.getElementById('txModal');
  var txBody=document.getElementById('txBody');
  var txList=document.getElementById('txList');
  var txTitle=document.getElementById('txTitle');
  var txMeta=document.getElementById('txMeta');
  var txBack=document.getElementById('txBack');
  var CUR_USER=null;
  document.getElementById('txClose').onclick=function(){txModal.classList.remove('open');};
  txBack.onclick=function(){showConvList();};
  txModal.addEventListener('click',function(e){if(e.target===txModal)txModal.classList.remove('open');});
  function roleCls(role){var r=(role||'').toLowerCase();if(r==='customer'||r==='cust'||r==='pelanggan')return 'role-customer';if(r==='bot'||r==='ccai'||r==='chatbot')return 'role-bot';return 'role-agent';}
  function roleLabel(role){var r=(role||'').toLowerCase();if(r==='customer'||r==='cust'||r==='pelanggan')return 'Customer';if(r==='bot'||r==='ccai'||r==='chatbot')return 'Bot / CCAI';return 'Agent';}

  function openUserConvs(uidx){
    var u=(DATA&&DATA.users)?DATA.users[uidx]:null; if(!u)return;
    CUR_USER=u; txModal.classList.add('open'); showConvList();
  }
  function openAnomConvs(idx){
    var a=(DATA&&DATA.anomali&&DATA.anomali.rows)?DATA.anomali.rows[idx]:null; if(!a)return;
    CUR_USER={label:a.label,name:a.label,taxid:'',conv:a.conv,sids:[]};
    txModal.classList.add('open'); showConvList();
  }
  function convQS(u){
    var qs='range='+encodeURIComponent(state.range);
    if(state.range==='custom'){qs+='&start='+encodeURIComponent(state.start)+'&end='+encodeURIComponent(state.end);}
    if(u.taxid){qs+='&taxid='+encodeURIComponent(u.taxid);}
    else if(u.name){qs+='&name='+encodeURIComponent(u.name);}
    else if(u.sids&&u.sids.length){qs+='&sid='+encodeURIComponent(u.sids[0]);}
    return qs;
  }
  function convRowHtml(c){
    var badges='';
    if(c.direct)badges+='<span class="pill">Langsung agent</span>';
    else if(c.reached)badges+='<span class="pill b">Ke agent</span>';
    return '<div class="cv-row" data-sid="'+esc(c.sid)+'">'
      +'<div class="cv-main"><div class="cv-top">'+esc(c.tanggal||'-')+' · '+esc(c.theme||'(tanpa tema)')+'</div>'
      +'<div class="cv-sub">'+(c.agent_name?('Agent: '+esc(c.agent_name)+' · '):'')+esc(c.sentiment||'')+' · SID '+esc(c.sid)+'</div></div>'
      +'<div class="cv-badges">'+badges+'<button class="btn-lihat">Detail</button></div></div>';
  }
  function showConvList(){
    var u=CUR_USER; if(!u)return;
    txTitle.textContent=(u.label||'Pengguna')+' — '+u.conv+' percakapan';
    txBack.style.display='none';
    txBody.style.display='none';
    txMeta.style.display='none'; txMeta.innerHTML='';
    txList.style.display='block';
    txList.innerHTML='<div class="loading">Memuat daftar percakapan…</div>';
    fetch('/api/awe/daily-users/conversations?'+convQS(u)).then(function(r){return r.json();}).then(function(res){
      if(!res||res.ok===false){txList.innerHTML='<div class="muted" style="padding:20px;">Gagal memuat: '+esc((res&&res.error)||'')+'</div>';return;}
      var convs=res.conversations||[];
      if(!convs.length){txList.innerHTML='<div class="muted" style="padding:20px;">Tidak ada percakapan.</div>';return;}
      var head='';
      if(res.truncated){head='<div class="note" style="margin:2px 4px 8px;">Menampilkan '+convs.length+' percakapan terbaru (dibatasi).</div>';}
      txList.innerHTML=head+convs.map(convRowHtml).join('');
    }).catch(function(){txList.innerHTML='<div class="muted" style="padding:20px;">Gagal memuat daftar percakapan.</div>';});
  }
  txList.addEventListener('click',function(e){
    var row=e.target.closest('.cv-row'); if(!row)return;
    openTranskrip(row.dataset.sid||'');
  });
  function openTranskrip(sid){
    txModal.classList.add('open');
    txBack.style.display=(CUR_USER?'inline-block':'none');
    txList.style.display='none';
    txBody.style.display='block';
    txMeta.style.display='block';
    txTitle.textContent='Transkrip — SID '+sid;
    txBody.innerHTML='<div class="loading">Memuat…</div>'; txMeta.textContent='';
    fetch('/api/awe/assess/transcript?sid='+encodeURIComponent(sid)).then(function(r){return r.json();}).then(function(d){
      if(!d.ok||!d.found){txBody.innerHTML='<div class="muted">'+(d.note||d.error||'Transkrip tidak ditemukan.')+'</div>';return;}
      txBody.innerHTML=(d.transkrip||[]).map(function(m){var rc=roleCls(m.role);return '<div class="tx-bubble"><div class="tx-role '+rc+'">'+esc(roleLabel(m.role))+'</div><div class="tx-text">'+esc(m.text||'')+'</div></div>';}).join('')||'<div class="muted">Transkrip kosong.</div>';
      var meta=[];
      if(d.customer)meta.push('Customer: '+esc(d.customer));
      if(d.agent_name)meta.push('Agent: '+esc(d.agent_name));
      if(d.jenis_layanan)meta.push('Layanan: '+esc(d.jenis_layanan));
      if(d.is_poro===1)meta.push('PORO: YA ⚠️');
      txMeta.innerHTML=meta.map(function(m){return '<span style="margin-right:12px;">'+m+'</span>';}).join('');
    }).catch(function(){txBody.innerHTML='<div class="muted">Gagal memuat transkrip.</div>';});
  }

  // ---- Delegated events (attached once; body persists across renders) ----
  body.addEventListener('click',function(e){
    var lb=e.target.closest('.btn-lihat');
    if(lb){
      if(lb.dataset.uidx!==undefined){openUserConvs(parseInt(lb.dataset.uidx,10));return;}
      if(lb.dataset.anom!==undefined){openAnomConvs(parseInt(lb.dataset.anom,10));return;}
    }
    var pb=e.target.closest('.pgb'); if(pb){pageAct(pb.dataset.tbl,pb.dataset.act);return;}
    var th=e.target.closest('th[data-sort]'); if(th&&th.dataset.tbl){sortAct(th.dataset.tbl,th.getAttribute('data-sort'));return;}
  });
  body.addEventListener('input',function(e){
    var s=e.target.closest('.tblSearch'); if(s){var t=TBL[s.dataset.tbl];if(t){t.state.q=s.value;t.state.page=1;renderTbl(s.dataset.tbl);}}
  });
  body.addEventListener('change',function(e){
    var f=e.target.closest('.tblFilter'); if(f){var t=TBL[f.dataset.tbl];if(t){t.state.filter=f.value;t.state.page=1;renderTbl(f.dataset.tbl);}return;}
    var p=e.target.closest('.perSel'); if(p){var t2=TBL[p.dataset.tbl];if(t2){t2.state.per=parseInt(p.value,10)||25;t2.state.page=1;renderTbl(p.dataset.tbl);}return;}
  });
  function pageAct(name,act){var t=TBL[name];if(!t)return;var st=t.state;if(act==='first')st.page=1;else if(act==='prev')st.page-=1;else if(act==='next')st.page+=1;else if(act==='last')st.page=1e9;renderTbl(name);}
  function sortAct(name,k){var t=TBL[name];if(!t)return;var st=t.state;if(st.sortK===k)st.sortDir=-st.sortDir;else{st.sortK=k;st.sortDir=-1;}st.page=1;renderTbl(name);}

  // ---- Main render ----
  function render(d){
    DATA=d;
    (d.users||[]).forEach(function(u,i){u._i=i;});
    var an=d.anomali||{conv:0,conv_pct:0,users:0,themes:[],rows:[]};
    (an.rows||[]).forEach(function(r,i){r._i=i;});
    var m=d.meta||{}, k=d.kpi||{};
    var df=d.direct_focus||{themes:[],sentiment:{Positif:0,Netral:0,Negatif:0},poro:0,avg_dur_direct:0,avg_dur_other:0};
    var nn=d.non_npwp||{conv:0,conv_pct:0,users:0,themes:[]};
    var cs=d.contact_stats||{median:0,mean:0,max:0,p90:0};
    rangeEl.textContent='Rentang: '+(m.date_min||'—')+' s/d '+(m.date_max||'—')+' · '+(m.total_conv||0)+' percakapan · '+(m.total_users||0)+' pengguna unik · '+(m.active_days||0)+' hari aktif'+(an.users?(' · '+an.conv+' baris anomali dikecualikan'):'');
    var html='';
    // KPIs (2 baris x 4)
    html+='<div class="kpis">'
      +kpi(k.total_users,'Pengguna unik')
      +kpi(k.avg_daily_users,'Rata² pengguna / hari')
      +kpi((k.direct_conv_pct||0)+'%','% percakapan langsung ke agent')
      +kpi(k.repeat_users,'Pengguna berulang (>1 hari)')+'</div>';
    html+='<div class="kpis">'
      +kpi((k.with_taxid||0)+' ('+(k.with_taxid_pct||0)+'%)','Teridentifikasi NIK/NPWP')
      +kpi(nn.users,'Pengguna non-NPWP (≈ per nama)')
      +kpi(cs.median,'Median kontak / pengguna')
      +kpi((an.users||0)+' / '+(an.conv||0),'Anomali (pengguna / percakapan)')+'</div>';
    // Tren multi-seri
    html+='<div class="card"><h3>Tren harian — pengguna, langsung agent &amp; anomali</h3>'+multiTrend(d.trend)
      +'<div class="note">Garis = jumlah per hari. Baris anomali (DNIS=customer dll) ditampilkan terpisah dan tidak dihitung sebagai pengguna.</div></div>';
    // Distribusi frekuensi + komposisi identitas
    var fd=(d.freq_dist||[]).map(function(t){return {lab:t.label,val:t.value};});
    var ic=(d.identity_comp||[]).map(function(t){return {lab:t.label,val:t.value};});
    html+='<div class="grid2">';
    html+=card('Distribusi frekuensi kontak (per pengguna)',fd.length?bars(fd,'#5a78ff'):empty());
    html+=card('Komposisi identitas pengguna',ic.length?bars(ic,'#33b378'):empty());
    html+='</div>';
    // Statistik kontak + indikasi kenapa langsung agent
    var statInner='<div class="statgrid">'
      +'<div><div class="sv">'+cs.median+'</div><div class="sl">Median kontak/pengguna</div></div>'
      +'<div><div class="sv">'+cs.mean+'</div><div class="sl">Rata² kontak/pengguna</div></div>'
      +'<div><div class="sv">'+cs.p90+'</div><div class="sl">Persentil 90</div></div>'
      +'<div><div class="sv">'+cs.max+'</div><div class="sl">Kontak terbanyak</div></div>'
      +'</div><div class="note">Seberapa sering satu orang menghubungi Kring Pajak pada rentang ini.</div>';
    var mx=Math.max(df.avg_dur_direct,df.avg_dur_other,1);
    var why='';
    why+='<div class="bar-row"><div class="lab">Durasi rata² (langsung)</div><div class="track"><div class="fill" style="width:'+pct(df.avg_dur_direct,mx)+'%;background:#f2726f;"></div></div><div class="num">'+fmtDur(df.avg_dur_direct)+'</div></div>';
    why+='<div class="bar-row"><div class="lab">Durasi rata² (lewat bot dulu)</div><div class="track"><div class="fill" style="width:'+pct(df.avg_dur_other,mx)+'%;"></div></div><div class="num">'+fmtDur(df.avg_dur_other)+'</div></div>';
    var ds=df.sentiment||{Positif:0,Netral:0,Negatif:0}, dst=(ds.Positif+ds.Netral+ds.Negatif)||1;
    why+='<div style="margin-top:8px;">'+bars([{lab:'Sentimen negatif (langsung)',val:ds.Negatif,sub:'('+pct(ds.Negatif,dst)+'%)'},{lab:'PORO (validasi identitas)',val:df.poro}],'#f0a35a')+'</div>';
    why+='<div class="note"><b>Kenapa langsung ke agent?</b> Tema yang butuh verifikasi/akun (mis. Lupa EFIN, Reset Password, Aktivasi) mendorong orang minta agent. PORO tinggi = banyak yang perlu validasi identitas.</div>';
    html+='<div class="grid2">'+card('Statistik kontak per pengguna',statInner)+card('Indikasi kenapa langsung ke agent',why)+'</div>';
    // Top penyebab hit agent (bar) + tabel penyebab
    var hc=d.hit_causes||[];
    var hcBars=hc.slice(0,10).map(function(c){return {lab:c.theme,val:c.direct,sub:'('+c.pct+'%)'};});
    html+=card('Top penyebab hit agent — volume percakapan langsung',hcBars.length?bars(hcBars,'#f2726f'):empty());
    html+=tblSkeleton({name:'cause',title:'Penyebab Hit Agent Terbanyak',unit:'tema',search:'Cari tema…',
      note:'Menggantikan tabel lama \'Pengguna berulang langsung agent\' (duplikatif dengan tabel pengguna + filter). Di sini diringkas per <b>tema / jenis layanan</b> pada percakapan yang <b>langsung ke agent</b> — lebih actionable untuk perbaikan bot/RAG.',
      theadCols:'<th class="th-sort" data-tbl="cause" data-sort="theme">Tema / jenis layanan</th><th class="th-sort" data-tbl="cause" data-sort="users">Pengguna unik</th><th class="th-sort" data-tbl="cause" data-sort="direct">Hit agent</th><th class="th-sort" data-tbl="cause" data-sort="pct">% dari semua hit</th><th class="th-sort" data-tbl="cause" data-sort="neg_pct">% negatif</th><th class="th-sort" data-tbl="cause" data-sort="poro">PORO</th><th class="th-sort" data-tbl="cause" data-sort="avg_dur">Durasi rata²</th>',colspan:7});
    // Tabel 1: Pengguna NIK/NPWP & tanpa penanda
    html+=tblSkeleton({name:'usr',title:'Daftar Pengguna (NIK/NPWP & tanpa penanda)',unit:'pengguna',search:'Cari nama / NIK / NPWP / tema…',
      note:'Klik <b>Lihat</b> untuk membuka daftar percakapan lalu transkripnya. Pengguna non-NPWP &amp; baris anomali dipisah ke tabel di bawah.',
      filterOpts:'<option value="all">Semua pengguna</option><option value="direct">Pernah langsung agent</option><option value="repeat">Berulang (>1 hari)</option><option value="taxid">Ada NIK/NPWP</option>',
      theadCols:'<th class="th-sort" data-tbl="usr" data-sort="label">Identitas</th><th>Jenis ID</th><th class="th-sort" data-tbl="usr" data-sort="conv">Percakapan</th><th class="th-sort" data-tbl="usr" data-sort="days">Hari</th><th class="th-sort" data-tbl="usr" data-sort="direct">Langsung agent</th><th>Tema utama</th><th class="th-sort" data-tbl="usr" data-sort="sentiment">Sentimen</th><th>Berulang</th><th>Aksi</th>',colspan:9});
    // Tabel 2: Non-NPWP
    html+=tblSkeleton({name:'nn',title:'Pengguna Non-NPWP (per nama)',unit:'nama',search:'Cari nama / tema…',
      note:'Pengguna tanpa NPWP (penanda <b>[NON-NPWP]</b>) dikelompokkan <b>per nama</b> (best-effort — nama bisa duplikat/typo). Total '+ (nn.conv||0) +' percakapan.',
      theadCols:'<th class="th-sort" data-tbl="nn" data-sort="label">Nama</th><th class="th-sort" data-tbl="nn" data-sort="conv">Percakapan</th><th class="th-sort" data-tbl="nn" data-sort="days">Hari</th><th class="th-sort" data-tbl="nn" data-sort="direct">Langsung agent</th><th>Tema utama</th><th class="th-sort" data-tbl="nn" data-sort="sentiment">Sentimen</th><th>Aksi</th>',colspan:7});
    // Tabel 3: Anomali
    html+=tblSkeleton({name:'an',title:'Anomali — Tidak Teridentifikasi',unit:'baris',search:'Cari label / tema…',
      note:'Baris dengan <b>DNIS = customer</b> / nama placeholder tanpa NIK — <b>bukan pengguna nyata</b> (artefak sistem / sesi tanpa identitas). <b>Dikeluarkan dari seluruh KPI &amp; tabel pengguna</b>; ditampilkan di sini untuk transparansi.',
      theadCols:'<th class="th-sort" data-tbl="an" data-sort="label">Label</th><th class="th-sort" data-tbl="an" data-sort="conv">Percakapan</th><th class="th-sort" data-tbl="an" data-sort="direct">Langsung agent</th><th class="th-sort" data-tbl="an" data-sort="days">Hari</th><th>Tema</th><th>Rentang</th><th>Aksi</th>',colspan:7});

    body.innerHTML=html;

    regTable('cause',{baseRows:function(){return DATA.hit_causes||[];},searchFields:['theme'],defaultSort:{k:'direct',dir:-1},colspan:7,rowHtml:causeRowHtml});
    regTable('usr',{baseRows:function(){return (DATA.users||[]).filter(function(u){return !u.non_npwp;});},searchFields:['label','name','themes'],filterFn:function(u,f){if(f==='direct')return u.direct>0;if(f==='repeat')return u.days>1;if(f==='taxid')return !!u.taxid;return true;},defaultSort:{k:'conv',dir:-1},colspan:9,rowHtml:userRowHtml});
    regTable('nn',{baseRows:function(){return (DATA.users||[]).filter(function(u){return u.non_npwp;});},searchFields:['label','themes'],defaultSort:{k:'conv',dir:-1},colspan:7,rowHtml:nnRowHtml});
    regTable('an',{baseRows:function(){return (DATA.anomali&&DATA.anomali.rows)||[];},searchFields:['label','themes'],defaultSort:{k:'conv',dir:-1},colspan:7,rowHtml:anRowHtml});

    renderTbl('cause');renderTbl('usr');renderTbl('nn');renderTbl('an');
  }

  function load(){
    body.innerHTML='<div class="loading">Memuat data…</div>';
    var qs='range='+encodeURIComponent(state.range);
    if(state.range==='custom'){qs+='&start='+encodeURIComponent(state.start)+'&end='+encodeURIComponent(state.end);}
    fetch('/api/awe/daily-users?'+qs).then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok===false){body.innerHTML='<div class="loading">Gagal memuat: '+esc(d.error||'')+'</div>';return;}
      render(d);
    }).catch(function(){body.innerHTML='<div class="loading">Gagal memuat data.</div>';});
  }
  var seg=document.getElementById('seg'), cust=document.getElementById('cust');
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    Array.prototype.forEach.call(seg.children,function(x){x.classList.remove('active');});
    b.classList.add('active');
    state.range=b.getAttribute('data-r');
    if(state.range==='custom'){cust.classList.add('show');}
    else{cust.classList.remove('show');load();}
  });
  document.getElementById('applyCustom').addEventListener('click',function(){
    state.start=document.getElementById('cStart').value;
    state.end=document.getElementById('cEnd').value;
    if(state.start&&state.end)load();
  });
  load();
})();
</script>
{% endblock %}
