{% extends "base.html" %}
{% block title %}{{ awe_title }} · AWE{% endblock %}
{% block head %}
<style>
  .awe-wrap{max-width:1120px;margin:0 auto;padding:22px 26px 60px;}
  .awe-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .awe-title{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .awe-sub{color:var(--text-muted,#8a8f98);font-size:12.5px;margin-top:4px;}
  .awe-tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .seg{display:flex;background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:12px;overflow:hidden;}
  .seg button{border:none;background:transparent;color:var(--text-muted,#8a8f98);padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .seg button.active{background:var(--accent-glow,rgba(90,120,255,.16));color:var(--accent,#5a78ff);}
  .cust{display:none;gap:6px;align-items:center;}
  .cust.show{display:flex;}
  .cust input{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:10px;color:var(--text-main,#e8e9ec);padding:7px 9px;font-size:12px;}
  .cust button{background:var(--accent,#5a78ff);color:#fff;border:none;border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:12px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:14px;padding:15px 16px;}
  .kpi .v{font-size:25px;font-weight:800;line-height:1.1;}
  .kpi .l{font-size:11.5px;color:var(--text-muted,#8a8f98);margin-top:3px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:860px){.grid2{grid-template-columns:1fr;}}
  .card{background:var(--panel-bg,#1b1c1f);border:1px solid var(--panel-border,#2a2b30);border-radius:14px;padding:15px 17px;margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12px;}
  .bar-row .lab{width:160px;flex:none;color:var(--text-muted,#8a8f98);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .track{flex:1;height:9px;background:var(--panel-border,#2a2b30);border-radius:6px;overflow:hidden;}
  .fill{height:100%;background:var(--accent,#5a78ff);border-radius:6px;}
  .bar-row .num{width:74px;text-align:right;flex:none;}
  table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
  table.tbl th,table.tbl td{padding:8px 9px;border-bottom:1px solid var(--panel-border,#2a2b30);text-align:left;white-space:nowrap;}
  table.tbl th{color:var(--text-muted,#8a8f98);font-weight:600;position:sticky;top:0;background:var(--panel-bg,#1b1c1f);}
  .tbl-wrap{max-height:600px;overflow:auto;}
  .spark{display:flex;align-items:flex-end;gap:3px;height:74px;}
  .spark .b{flex:1;background:var(--accent,#5a78ff);border-radius:3px 3px 0 0;min-height:2px;opacity:.85;}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(240,90,90,.16);color:#f2726f;}
  .muted{color:var(--text-muted,#8a8f98);}
  .loading{color:var(--text-muted,#8a8f98);padding:34px;text-align:center;}
</style>
{% endblock %}
{% block content %}
<div class="awe-wrap" id="aweRoot" data-section="{{ awe_section }}">
  <div class="awe-head">
    <div>
      <h1 class="awe-title">{{ awe_title }}</h1>
      <div class="awe-sub" id="aweRange">Memuat…</div>
    </div>
    <div class="awe-tb">
      <div class="seg" id="seg">
        <button data-r="today">Hari ini</button>
        <button data-r="yesterday">Kemarin</button>
        <button data-r="7d" class="active">7 hari</button>
        <button data-r="30d">30 hari</button>
        <button data-r="90d">90 hari</button>
        <button data-r="all">Semua</button>
        <button data-r="custom">Kustom</button>
      </div>
      <div class="cust" id="cust">
        <input type="date" id="cStart"><span class="muted">s/d</span><input type="date" id="cEnd">
        <button id="applyCustom">Terapkan</button>
      </div>
    </div>
  </div>
  <div id="aweBody"><div class="loading">Memuat data…</div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var root=document.getElementById('aweRoot');
  var section=root.getAttribute('data-section');
  var body=document.getElementById('aweBody');
  var rangeEl=document.getElementById('aweRange');
  var state={range:'7d',start:'',end:''};
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pct(n,d){return d? Math.round(1000*n/d)/10:0;}
  function bars(items,color){
    var max=1; items.forEach(function(i){if(i.val>max)max=i.val;});
    return items.map(function(i){
      return '<div class="bar-row"><div class="lab" title="'+esc(i.lab)+'">'+esc(i.lab)+'</div>'+
        '<div class="track"><div class="fill" style="width:'+pct(i.val,max)+'%;'+(color?'background:'+color+';':'')+'"></div></div>'+
        '<div class="num">'+i.val+(i.sub?' <span class="muted">'+esc(i.sub)+'</span>':'')+'</div></div>';
    }).join('');
  }
  function card(title,inner){return '<div class="card"><h3>'+esc(title)+'</h3>'+inner+'</div>';}
  function kpi(v,l){return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+esc(l)+'</div></div>';}
  function spark(trend){
    if(!trend||!trend.length) return '<div class="muted">Tidak ada data.</div>';
    var max=1; trend.forEach(function(t){if(t.total>max)max=t.total;});
    var s='<div class="spark">';
    trend.forEach(function(t){
      var h=Math.round(100*t.total/max);
      s+='<div class="b" title="'+esc(t.day)+': '+t.total+' total, '+t.gap+' gap, '+t.negatif+' negatif" style="height:'+h+'%"></div>';
    });
    return s+'</div>';
  }
  function render(d){
    rangeEl.textContent='Rentang: '+(d.meta.date_min||d.range.start||'—')+' s/d '+(d.meta.date_max||d.range.end||'—')+' · '+d.meta.total+' percakapan · '+d.meta.customers+' pelanggan';
    var html='';
    if(section==='dasbor'){
      var cov=d.coverage, sent=d.sentiment;
      html+='<div class="kpis">'+kpi(d.meta.total,'Total percakapan')+kpi(pct(cov.covered,cov.total)+'%','Coverage (covered)')+kpi(d.deflection.gap_pct+'%','Deflection gap')+kpi(pct(sent.Negatif,d.meta.total)+'%','Sentimen negatif')+'</div>';
      html+='<div class="card"><h3>Tren harian (volume percakapan)</h3>'+spark(d.trend)+'</div>';
      html+='<div class="grid2">'+card('Coverage',bars([{lab:'Covered',val:cov.covered},{lab:'Gray',val:cov.gray},{lab:'Uncovered',val:cov.uncovered}]))+card('Sentimen',bars([{lab:'Positif',val:sent.Positif},{lab:'Netral',val:sent.Netral},{lab:'Negatif',val:sent.Negatif}]))+'</div>';
    } else if(section==='coverage'){
      var cov=d.coverage;
      html+='<div class="kpis">'+kpi(cov.covered,'Covered')+kpi(cov.gray,'Gray')+kpi(cov.uncovered,'Uncovered')+kpi(d.deflection.gap_pct+'%','Deflection gap')+'</div>';
      html+='<div class="grid2">'+card('Coverage band',bars([{lab:'Covered',val:cov.covered},{lab:'Gray',val:cov.gray},{lab:'Uncovered',val:cov.uncovered}]))+card('Deflection',bars([{lab:'Gap (langsung ke agent)',val:d.deflection.gap},{lab:'Tanpa gap',val:d.deflection.no_gap}]))+'</div>';
      var dt=d.deflection_by_topic.map(function(t){return {lab:t.topik,val:t.gap,sub:'/'+t.total+' ('+t.gap_pct+'%)'};});
      html+=card('Deflection gap per topik (top 15)',dt.length?bars(dt,'#f2726f'):'<div class="muted">Tidak ada data.</div>');
    } else if(section==='taksonomi'){
      var tax=d.taxonomy.map(function(t){return {lab:t.label,val:t.value};});
      html+=card('Taksonomi kasus (case label)',tax.length?bars(tax,'#a97bff'):'<div class="muted">Tidak ada data.</div>');
      var opp=d.deflection_by_topic.slice(0,10).map(function(t){return {lab:t.topik,val:t.gap,sub:'('+t.gap_pct+'%)'};});
      html+=card('Peluang deflection (topik gap tertinggi)',opp.length?bars(opp,'#f0a35a'):'<div class="muted">Tidak ada data.</div>');
    } else if(section==='sentimen'){
      var sent=d.sentiment;
      html+='<div class="grid2">'+card('Sentimen',bars([{lab:'Positif',val:sent.Positif},{lab:'Netral',val:sent.Netral},{lab:'Negatif',val:sent.Negatif}]))+card('Emosi',d.emotions.length?bars(d.emotions.map(function(e){return{lab:e.label,val:e.value};})):'<div class="muted">Tidak ada data.</div>')+'</div>';
      var rows=d.agents.map(function(a){return '<tr><td>'+a.rank+'</td><td>'+esc(a.name)+'</td><td>'+a.count+'</td><td>'+a.avg_durasi+'</td><td>'+a.pos_rate+'%</td><td>'+a.neg_rate+'%</td><td><b>'+a.score+'</b></td></tr>';}).join('');
      html+='<div class="card"><h3>Kinerja agent</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Agent</th><th>Chat</th><th>Durasi rata²</th><th>Positif</th><th>Negatif</th><th>Skor</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="muted">Tidak ada data.</td></tr>')+'</tbody></table></div></div>';
    } else if(section==='percakapan'){
      var rows=d.conversations.map(function(c){return '<tr><td>'+esc(c.tanggal)+'</td><td>'+esc(c.customer)+'</td><td>'+esc(c.agent_name)+'</td><td>'+esc(c.mapped_intent)+'</td><td>'+esc(c.coverage_band)+'</td><td>'+esc(c.case_label)+'</td><td>'+esc(c.sentiment)+'</td><td>'+(c.deflection_gap?'<span class="pill">gap</span>':'')+'</td></tr>';}).join('');
      html+='<div class="card"><h3>Detail percakapan ('+d.conversations.length+' baris pertama)</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>Customer</th><th>Agent</th><th>Intent</th><th>Coverage</th><th>Kasus</th><th>Sentimen</th><th>Gap</th></tr></thead><tbody>'+(rows||'<tr><td colspan="8" class="muted">Tidak ada data.</td></tr>')+'</tbody></table></div></div>';
    }
    body.innerHTML=html;
  }
  function load(){
    body.innerHTML='<div class="loading">Memuat data…</div>';
    var qs='range='+encodeURIComponent(state.range);
    if(state.range==='custom'){qs+='&start='+encodeURIComponent(state.start)+'&end='+encodeURIComponent(state.end);}
    fetch('/api/awe/analytics?'+qs).then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok===false){body.innerHTML='<div class="loading">Gagal memuat: '+esc(d.error||'')+'</div>';return;}
      render(d);
    }).catch(function(){body.innerHTML='<div class="loading">Gagal memuat data.</div>';});
  }
  var seg=document.getElementById('seg'), cust=document.getElementById('cust');
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    Array.prototype.forEach.call(seg.children,function(x){x.classList.remove('active');});
    b.classList.add('active');
    state.range=b.getAttribute('data-r');
    if(state.range==='custom'){cust.classList.add('show');}
    else{cust.classList.remove('show');load();}
  });
  document.getElementById('applyCustom').addEventListener('click',function(){
    state.start=document.getElementById('cStart').value;
    state.end=document.getElementById('cEnd').value;
    if(state.start&&state.end)load();
  });
  load();
})();
</script>
{% endblock %}
